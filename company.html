*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Hiragino Sans','Meiryo',sans-serif;background:#f1f5f9;color:#1e293b;min-height:100vh;font-size:12px;}

function _tokureiDate(c){

async function passSubmit(){
  var v=document.getElementById('passInput').value.trim();
  var err=document.getElementById('passErr');
  if(_passMode==='change'){
    var vn=document.getElementById('passInput2').value.trim();
    if(v.length<1){ err.textContent='現在のPINを入力してください'; return; }
    if(vn.length<4){ err.textContent='新しいPINは4文字以上で設定してください'; return; }
    err.textContent='変更中...';
    var cr=await callRpc('company_view_change_pass',{p_token:currentToken,p_old:v,p_new:vn});
    if(!cr||!cr.ok){
      err.textContent=(cr&&cr.error==='wrongpass')?'現在のPINが違います':((cr&&cr.error==='nopass')?'PINが未設定です。初回設定を行ってください。':'変更に失敗しました。もう一度お試しください。');
      return;
    }
    err.textContent='確認中...';
    var lrc=await loadData(vn);
    if(lrc&&lrc.ok){ _correctPass=vn; document.getElementById('passScreen').classList.add('hide'); }
    return;
  }
  if(_passMode==='setup'){
    var v2=document.getElementById('passInput2').value.trim();
    if(v.length<4){ err.textContent='パスワードは4文字以上で設定してください'; return; }
    if(v!==v2){ err.textContent='確認用パスワードが一致しません'; return; }
    err.textContent='設定中...';
    var sr=await callRpc('company_view_set_pass',{p_token:currentToken,p_pass:v});
    if(!sr||!sr.ok){
      if(sr&&sr.error==='exists'){ _passMode='enter'; document.getElementById('passInput2').value=''; _showPassScreen(); err.textContent='すでにパスワードが設定されています。入力してログインしてください。'; return; }
      err.textContent='設定に失敗しました。もう一度お試しください。'; return;
    }
  }
  err.textContent='確認中...';
  var lr=await loadData(v);
  if(lr&&lr.passErr){ err.textContent='パスワードが違います'; return; }
  _correctPass=v;
  document.getElementById('passScreen').classList.add('hide');
}

function _companyTasks(){
  var t={docs:0, idpw:0, ball:0, ballCases:[], hearing:0, total:0};
  // 未提出書類（ご依頼事項と同じロジック）
  var hasKensetsu=false, kokkoAppliedAny=false;
  var APPLIED=['申請済み','補正未着手','補正可能','補正完了','完了(許可済)'];
  allCases.forEach(function(c){
    var rs=(c.residence_status||'');
    if((rs==='特定活動'||rs==='特定技能1号') && String(c.applicant_field||'').indexOf('建設')>=0){
      hasKensetsu=true;
      var k=getKokkoStatus(c)||((_extraByCase[c.id]||{}).kokko_status||'');
      if(APPLIED.indexOf(k)>=0) kokkoAppliedAny=true;
    }
  });
  var missing=[];
  Object.keys(coDocs).forEach(function(name){ if(docInList(coDocs[name]) && docState(coDocs[name])==='todo') missing.push(name); });
  if(hasKensetsu && _coUkeireAri){
    if(!_coHasIdpw && !kokkoAppliedAny) t.idpw=1;
  } else if(hasKensetsu){
    if(!kokkoAppliedAny){
      _CKS_K16.forEach(function(n){ if(_isOfusaMade(n)) return; var v=coDocs[n]||{}; if(!_hasVal(v.staff)&&!_hasVal(v.skip)&&!_hasVal(v.autoskip)) t.docs++; });
    }
  }
  if(hasKensetsu){
    if(!_nyukanGateClosed()) t.docs+=missing.filter(function(n){ return !_isKokkoDocName(n); }).length;
  } else {
    t.docs+=missing.length;
  }
  // ボールが企業側にある案件（確認・サイン・押印・書類の返送待ちなど）
  allCases.forEach(function(c){
    if(c.status==='完了'||c.status==='審査完了') return;
    if(_CKS_BALL.indexOf(c.status)>=0){ t.ball++; t.ballCases.push({id:c.id, applicant:c.applicant||c.name||'', status:c.status}); }
  });
  // 企業情報ヒアリング未回答
  if(companyHearingExists && !companyHearingDone && companyHearingShow!==false) t.hearing=1;
  t.total=t.docs+t.idpw+t.ball+t.hearing;
  return t;

function expInfo(dateStr){

  var d=new Date(dateStr); if(isNaN(d)) return {txt:esc(dateStr),cls:'none',days:null};
  var days=Math.ceil((d-new Date())/86400000);

  var txt = dateStr + '（' + (days<0?('期限切れ '+(-days)+'日'):('残'+days+'日')) + '）';
  return {txt:txt,cls:cls,days:days};
}

    hasKs=true;
    var k=getKokkoStatus(c)||((_extraByCase[c.id]||{}).kokko_status||'');

    var stg=-1; for(var i=0;i<_CKS_COLS.length;i++){ if(_CKS_COLS[i].statuses.indexOf(c.status)>=0){ stg=i; break; } }

  });
  if(!hasKs) return '';
  var minExpire=null, anyT1App=false;
  allCases.forEach(function(c){
    var rs=(c.residence_status||'');
    if((rs!=='特定活動'&&rs!=='特定技能1号')||String(c.applicant_field||'').indexOf('建設')<0) return;
    var exd2=_cksParse(c.expire); if(exd2&&(!minExpire||exd2<minExpire)) minExpire=exd2;
    if(rs==='特定技能1号'){
      var stg2=-1; for(var i=0;i<_CKS_COLS.length;i++){ if(_CKS_COLS[i].statuses.indexOf(c.status)>=0){ stg2=i; break; } }
      if(c.receipt_date||stg2>=3) anyT1App=true;
    }
  });
  var h='<div style="background:#fff;border:1px solid #e2e8f0;border-radius:12px;padding:14px 16px;margin:0 0 14px;">';
  h+='<div style="font-size:13.5px;font-weight:900;color:#0f2040;margin-bottom:4px;">🏗🛂 書類・申請の進捗（建設特定技能）</div>';
  h+=_cksKokkoAxisHtml(minReqD, kokkoSt, anyApplied);
  h+=_cksNyukanAxisHtml(minExpire, anyT1App);  // ver.20260921.20: 入管書類の軸もダッシュボードに
  h+=_cksFinalDlNote(postExpire?_cksAddM(postExpire,-5):null);
  h+='<button class="req-btn" onclick="switchGroup(\'docs\')">提出書類を開く</button>';
  h+='</div>';
  return h;
}

    if(over) chip='<span style="background:#dc2626;color:#fff;border-radius:6px;padding:2px 8px;font-weight:900;">⚠ '+(-days)+'日超過・至急ご対応ください</span>';

      if(kokkoMissing.length){

function _fbToggleWidget(){
  _fbCollapsed=!_fbCollapsed;
  try{ localStorage.setItem('fb_collapsed_'+currentToken, _fbCollapsed?'1':'0'); }catch(e){}
  _fbApplyCollapsed();
}
function _fbApplyCollapsed(){
  var btn=document.getElementById('fbCollapsedBtn'), panel=document.getElementById('fbPanel');
  if(btn) btn.style.display=_fbCollapsed?'inline-flex':'none';
  if(panel) panel.style.display=_fbCollapsed?'none':'block';
}
function _fbToggleScope(){
  var scEl=document.querySelector('input[name="fbScope"]:checked');
  var wrap=document.getElementById('fbCaseWrap'); if(wrap) wrap.style.display=(scEl&&scEl.value==='case')?'':'none';
  if(scEl&&scEl.value==='case') _fbFilterCases();

async function submitCompanyFeedback(){
  var scEl=document.querySelector('input[name="fbScope"]:checked');
  var sc=scEl?scEl.value:'global';
  var body=((document.getElementById('fbBody')||{}).value||'').trim();
  var msg=document.getElementById('fbMsg');
  var caseId=(sc==='case')?(((document.getElementById('fbCaseSel')||{}).value)||''):'';
  if(!body){ if(msg){msg.style.color='#dc2626';msg.textContent='コメント・要望を入力してください。';} return; }
  if(sc==='case' && !caseId){ if(msg){msg.style.color='#dc2626';msg.textContent='案件を選択してください。';} return; }
  var btn=document.getElementById('fbSendBtn'); if(btn){ btn.disabled=true; btn.textContent='送信中...'; }
  try{
    var res=await callRpc('submit_company_feedback',{p_token:currentToken,p_pass:(_correctPass||null),p_case_id:(caseId||null),p_body:body});
    if(res && res.ok){
      if(msg){ msg.style.color='#16a34a'; msg.textContent='\u2705 送信しました。大房側で確認いたします。'; }
      var bEl=document.getElementById('fbBody'); if(bEl) bEl.value='';
      _loadCompanyFeedbackHistory();
    }else{
      if(msg){ msg.style.color='#dc2626'; msg.textContent='\u274c 送信に失敗しました'+(res&&res.error?'（'+res.error+'）':'')+'。'; }
    }
  }catch(e){ if(msg){ msg.style.color='#dc2626'; msg.textContent='\u274c 送信エラー: '+((e&&e.message)||e); } }
  if(btn){ btn.disabled=false; btn.textContent='送信'; }
}
async function _loadCompanyFeedbackHistory(){
  var box=document.getElementById('fbHistory'); if(!box) return;
  try{
    var res=await callRpc('list_company_feedback',{p_token:currentToken,p_pass:(_correctPass||null)});
    var rows=Array.isArray(res)?res:[];
    if(!rows.length){ box.innerHTML='<div style="font-size:11px;color:#94a3b8;">送信履歴はまだありません。</div>'; return; }
    var caseName={}; (allCases||[]).forEach(function(c){ if(c.id) caseName[c.id]=(c.applicant||c.name||''); });
    var hh='<div style="font-size:11px;font-weight:700;color:#64748b;margin-bottom:5px;">送信履歴<span style="font-weight:400;color:#cbd5e1;">（'+rows.length+'件）</span></div>';
    // ver.20260618d2: 送信履歴は3件分の高さで表示、それ以上はスクロール
    hh+='<div style="max-height:186px;overflow-y:auto;padding-right:4px;">';
    rows.forEach(function(f){
      var stColor=f.status==='done'?'#16a34a':'#d97706';
      var stLabel=f.status==='done'?'対応済':'未対応';
      var scopeLabel=f.scope==='case'?('案件: '+(caseName[f.case_id]||f.case_id||'')):'全体';
      hh+='<div style="border:1px solid #f1f5f9;border-radius:8px;padding:8px 10px;margin-bottom:6px;background:#fafafa;">';
      hh+='<div style="display:flex;justify-content:space-between;gap:8px;font-size:10px;color:#94a3b8;margin-bottom:3px;"><span>'+esc(scopeLabel)+'</span><span><span style="color:'+stColor+';font-weight:700;">'+stLabel+'</span>\u3000'+esc(f.created_at||'')+'</span></div>';
      hh+='<div style="font-size:12px;color:#334155;white-space:pre-wrap;word-break:break-word;">'+esc(f.body||'')+'</div>';
      hh+='</div>';
    });
    hh+='</div>';
    box.innerHTML=hh;
  }catch(e){ box.innerHTML='<div style="font-size:11px;color:#dc2626;">履歴の取得に失敗しました。</div>'; }
}
function renderDashboard(){

  var active=total-done;
  var soon=allCases.filter(function(c){if(!_expireTracked(c))return false;var i=expInfo(c.expire);return i.days!=null&&i.days>=0&&i.days<=90;}).length;
  var expired=allCases.filter(function(c){if(!_expireTracked(c))return false;var i=expInfo(c.expire);return i.days!=null&&i.days<0;}).length;
  var h='';
  h+=renderRequests();
  h+=_kokkoDashCard();  // ver.20260921.19: 国交省書類の進捗を案件に埋もれさせずダッシュボードへ
  h+=_companyHearingCard();

  h+='<div class="card" onclick="switchGroup(\'done\')"><div class="lbl">手続き完了</div><div class="num">'+done+'<small> 件</small></div></div>';
  h+='<div class="card '+(missingDocCount>0?'warn':'')+'" onclick="switchGroup(\'docs\')"><div class="lbl">未提出の書類</div><div class="num">'+missingDocCount+'<small> 件</small></div></div>';
  h+='</div>';
  // 大房行政書士法人担当窓口（部署=案件チーム最頻値 / 担当=ofusa_staff）
  var teamCount={}; allCases.forEach(function(c){var t=(c.team||'').trim();if(t)teamCount[t]=(teamCount[t]||0)+1;});
  var topTeam='',topN=0; Object.keys(teamCount).forEach(function(t){if(teamCount[t]>topN){topN=teamCount[t];topTeam=t;}});
  if(companyOfusaStaff||topTeam){
    h+='<div class="section-title">🤝 大房行政書士法人担当窓口</div>';
    h+='<div class="contact-card">';
    h+='<div class="ct-row"><span class="ct-l">部署</span><span class="ct-v">'+esc(topTeam||'—')+'</span></div>';
    h+='<div class="ct-row"><span class="ct-l">担当</span><span class="ct-v">'+esc(companyOfusaStaff||'—')+'</span></div>';
    h+='</div>';
  }
  // 特例期限（申請済み等で特例期間中の案件）
  var tokSoon=allCases.filter(function(c){if(!_tokureiTracked(c))return false;var td=_tokureiDate(c);if(!td)return false;var d=expInfo(td).days;return d!=null&&d>=0&&d<=30;}).length;
  var tokOver=allCases.filter(function(c){if(!_tokureiTracked(c))return false;var td=_tokureiDate(c);if(!td)return false;var d=expInfo(td).days;return d!=null&&d<0;}).length;
  if(expired>0||soon>0||tokOver>0||tokSoon>0){
    h+='<div class="section-title">⏰ 期限アラート</div>';
    h+='<div class="cards">';
    if(expired>0) h+='<div class="card warn" onclick="openList(\'expired\')"><div class="lbl">在留期限切れ</div><div class="num">'+expired+'<small> 名</small></div></div>';
    if(soon>0) h+='<div class="card alert" onclick="openList(\'soon\')"><div class="lbl">在留期限 90日以内</div><div class="num">'+soon+'<small> 名</small></div></div>';
    if(tokOver>0) h+='<div class="card warn" onclick="openList(\'tokOver\')"><div class="lbl">特例期限 超過</div><div class="num">'+tokOver+'<small> 名</small></div></div>';
    if(tokSoon>0) h+='<div class="card alert" onclick="openList(\'tokSoon\')"><div class="lbl">特例期限 30日以内</div><div class="num">'+tokSoon+'<small> 名</small></div></div>';
    h+='</div>';
  }
  if(missingDocCount>0){
    h+='<div class="note">⚠️ 未提出の書類が <b>'+missingDocCount+'件</b> あります。「提出書類」タブからご確認のうえ、ご提出をお願いいたします。</div>';
  }
  h+=renderStats();
  return h;
}

// ver.20260921.12: 建設×特活で国交省未申請の間、入管書類の提出をクローズ（国交省申請＝申請日が入ると自動オープン）
function _nyukanGateClosed(){
  // オープン条件（いずれか）: ①入管書類のいずれかに依頼日(req)が入っている ②国交省ステータスが補正段階〜完了
  //（「申請済み」ではまだ開かない。補正なしで一気に完了(許可済)になるケースもあるため完了も含む）
  var hasKs=false, anyOpen=false;
  var KOKKO_OPEN=['補正未着手','補正可能','補正完了','完了(許可済)'];
  allCases.forEach(function(c){
    if((c.residence_status||'')!=='特定活動') return;
    if(String(c.applicant_field||'').indexOf('建設')<0) return;
    hasKs=true;
    var k=getKokkoStatus(c)||((_extraByCase[c.id]||{}).kokko_status||'');
    if(KOKKO_OPEN.indexOf(k)>=0) anyOpen=true;
  });
  if(!hasKs) return false;
  if(anyOpen) return false;
  var reqFound=false;
  Object.keys(coDocs).forEach(function(n){
    if(_isKokkoDocName(n)) return;
    var v=coDocs[n]||{};
    if(v.req!=null && v.req!=='' && v.req!=='false') reqFound=true;
  });
  return !reqFound;
}
function _isKokkoDocName(n){ return /^\d{1,2}[.．]/.test(String(n||'').trim()); }

function _linkifyText(t){
  var e=esc(String(t||''));
  e=e.replace(/(https?:\/\/[^\s<）)]+)/g,function(u){ return '<a href="'+u+'" target="_blank" rel="noopener" style="color:#1a56db;font-weight:700;word-break:break-all;">'+u+'</a>'; });
  return e.replace(/\n/g,'<br>');
}

  var s='';
  names.forEach(function(name){

function _nyukanSampleKey(label){
  var t=String(label||'');
  var has=function(){ for(var i=0;i<arguments.length;i++){ if(t.indexOf(arguments[i])<0) return false; } return true; };
  if(t.indexOf('登記事項')>=0) return 'tokibo';
  if(t.indexOf('法定調書')>=0 || t.indexOf('四季報')>=0 || t.indexOf('上場証明')>=0) return 'houtei';
  if(t.indexOf('協議会')>=0) return 'kyogikai';
  if(t.indexOf('個人住民税')>=0) return 'kojin_shimin';
  if(t.indexOf('法人住民税')>=0 || has('地方税','法人')) return 'zeimu_shimin';
  if(t.indexOf('納税証明')>=0){
    if(t.indexOf('法人税')>=0) return 'zeimu_3';
    if(t.indexOf('申告所得税')>=0 || t.indexOf('相続税')>=0 || t.indexOf('贈与税')>=0) return 'kojin_zeimu3';
    return 'zeimu_3';
  }
  if(t.indexOf('労働保険')>=0) return 'rodo_hoken';
  if(t.indexOf('社会保険料')>=0) return 'shakai_hoken';
  if(t.indexOf('住民票')>=0) return (t.indexOf('役員')>=0) ? 'jumin_hyo' : 'kojin_jumin';
  if(t.indexOf('決算')>=0) return 'kessan';
  if(t.indexOf('確定申告')>=0) return 'kakutei_shinkoku';
  if(t.indexOf('就業規則')>=0) return 'shugyo_kisoku';
  if(t.indexOf('賃金')>=0) return 'chingin_kitei';
  if(t.indexOf('36協定')>=0 || t.indexOf('３６協定')>=0 || t.indexOf('時間外労働')>=0) return 'san_roku';
  if(t.indexOf('変形労働')>=0) return 'henkei_rodo';
  if(t.indexOf('年間カレンダー')>=0) return 'nengkan_cal';
  if(t.indexOf('間取り')>=0 || t.indexOf('物件')>=0 || t.indexOf('居住予定')>=0) return 'madori';
  if(t.indexOf('医療保険')>=0 || t.indexOf('資格確認書')>=0 || t.indexOf('マイナポータル')>=0) return 'kojin_iryo';
  if(t.indexOf('国民健康保険')>=0) return 'kojin_kokuho';
  if(t.indexOf('被保険者記録照会回答票')>=0) return 'kojin_nenkin_rec';
  if(t.indexOf('被保険者記録照会')>=0 || t.indexOf('国民年金')>=0) return 'kojin_nenkin_fu';
  return null;
}

      +'登記事項証明書・住民票・納税証明書などは<b>発行から3ヶ月以内</b>でないと申請に使えないため、先に取得されると期限切れで再提出になります。'
      +'<b>国土交通省の審査が補正段階または完了（許可済）に進むか、担当者が書類のご案内（依頼日の入力）をすると、この欄は自動でオープンし、アップロードボタンが表示されます。</b></div>';
    if(nyukanNames.length){
      h+='<div class="doc-co" style="opacity:.45;pointer-events:none;filter:grayscale(60%);">'+_docRowsHtml(nyukanNames)+'</div>';
    }
  } else {
    if(upUrl){ h+='<div><a class="upload-btn" href="'+esc(upUrl)+'" target="_blank" rel="noopener">📤 入管書類をアップロード</a></div>'; }
    if(nyukanNames.length){ h+='<div class="doc-co">'+_docRowsHtml(nyukanNames)+'</div>'; }
    else h+='<div class="empty" style="padding:10px 0;">入管書類のご案内はまだありません。</div>';
  }
  return h;
}

function exportCsv(){
  var cols=['氏名','国籍','登録支援機関','申請在留資格','申請種別','分野・職種','進捗','受付番号','在留期限','特例期限','部署','担当'];
  var rows=[cols];
  allCases.forEach(function(c){
    var field=[c.applicant_field,c.job_category].filter(Boolean).join(' / ')||(c.industry||'');
    var tok=_tokureiTracked(c)?(_tokureiDate(c)||''):'';
    rows.push([c.applicant||c.name||'',natVal(c),c.org||'',c.residence_status||'',c.app_type||'',field,getExternalStatus(c.status),c.receipt_no||'',c.expire||'',tok,c.team||'',c.staff||'']);
  });
  var csv='\uFEFF'+rows.map(function(r){return r.map(function(v){v=String(v==null?'':v);return /[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v;}).join(',');}).join('\r\n');
  var blob=new Blob([csv],{type:'text/csv;charset=utf-8;'});
  var url=URL.createObjectURL(blob);
  var a=document.createElement('a'); a.href=url;
  var d=new Date(),p=function(n){return n<10?'0'+n:n;};
  a.download='申請一覧_'+d.getFullYear()+p(d.getMonth()+1)+p(d.getDate())+'.csv';
  document.body.appendChild(a); a.click(); document.body.removeChild(a); URL.revokeObjectURL(url);
}

  rows.forEach(function(c){

    if(companyShowMlit){ var ml=getKokkoStatus(c); if(ml) stCell+='<div style="font-size:9px;color:'+agencyColor(ml)+';font-weight:700;margin-top:3px;">🏗 国交省 '+esc(ml)+'</div>'; }

    h+='<td><div class="wrap-cell wrap-st" style="max-width:110px;">'+stCell+'</div></td>';
    h+='<td>'+esc(c.receipt_no||'—')+'</td>';
    // 在留期限（残日数なし・日付のみ）／特例日／一時帰国を縦に表示
    var td2=_tokureiTracked(c)?_tokureiDate(c):null;
    var tempR=_dateOnly(c.temp_return);
    var expCell='<div class="exp-cell">';
    expCell+='<div class="ex-row"><span class="exl">在留</span><span class="exp '+ei.cls+'">'+esc(_dateOnly(c.expire))+'</span></div>';
    if(td2){ var ti=expInfo(td2); expCell+='<div class="ex-row"><span class="exl">特例</span><span class="exp '+ti.cls+'">'+esc(_dateOnly(td2))+'</span></div>'; }
    if(tempR!=='—'){ expCell+='<div class="ex-row"><span class="exl">一時帰国</span><span class="exv">'+esc(tempR)+'</span></div>'; }
    expCell+='</div>';

    h+='<td><div class="staff-cell"><div><span class="sl">部署</span>'+esc(c.team||'—')+'</div><div><span class="sl">担当</span>'+esc(c.staff||'—')+'</div></div></td>';
    h+='<td style="white-space:nowrap;">'+_rowPdfIcons(c)+'</td>';

  });
  h+='</tbody></table></div>';
  return h;

function casesByKey(key){
  return allCases.filter(function(c){
    if(key==='all') return true;
    if(key==='active') return classifyCase(c)==='active';
    if(key==='done') return classifyCase(c)==='done';
    var ei=expInfo(c.expire);
    if(key==='expired') return _expireTracked(c)&&ei.days!=null&&ei.days<0;
    if(key==='soon') return _expireTracked(c)&&ei.days!=null&&ei.days>=0&&ei.days<=90;
    if(key==='tokOver'){ if(!_tokureiTracked(c))return false; var t=expInfo(_tokureiDate(c)); return t.days!=null&&t.days<0; }
    if(key==='tokSoon'){ if(!_tokureiTracked(c))return false; var t=expInfo(_tokureiDate(c)); return t.days!=null&&t.days>=0&&t.days<=30; }
    return false;
  });
}
var _LIST_TITLES={all:'全申請',active:'進行中の申請',done:'手続き完了',expired:'在留期限切れ',soon:'在留期限 90日以内',tokOver:'特例期限 超過',tokSoon:'特例期限 30日以内'};
function openList(key){
  var list=casesByKey(key);
  var h='<div class="dt-name">'+(_LIST_TITLES[key]||'')+'</div><div class="dt-sub">'+list.length+'件 ・ タップで詳細</div>';
  if(!list.length){ h+='<div class="empty">該当する申請はありません。</div>'; }
  else {
    h+='<div class="list-wrap">';
    list.forEach(function(c){
      var nm=c.applicant||c.name||'—';
      var sub=[c.residence_status,getExternalStatus(c.status)].filter(Boolean).join(' / ');
      h+='<div class="list-item" onclick="openDetail(\''+esc(c.id)+'\')"><div class="li-nm">'+esc(nm)+'</div><div class="li-sub">'+esc(sub)+'</div></div>';
    });
    h+='</div>';
  }
  document.getElementById('detailBody').innerHTML=h;
  document.getElementById('detailScreen').classList.remove('hide');
}
function openDetail(caseId){
  var c=allCases.filter(function(x){return x.id===caseId;})[0]; if(!c) return;
  var p=personsByCase[caseId]||{};
  document.getElementById('detailBody').innerHTML=renderDetail(c,p);
  document.getElementById('detailScreen').classList.remove('hide');
}
function closeDetail(){ document.getElementById('detailScreen').classList.add('hide'); }
function _dv(v){ return (v==null||v==='')?'—':esc(v); }
function renderDetail(c,p){
  function row(l,v){ return '<div class="dt-row"><span class="dt-l">'+l+'</span><span class="dt-v">'+v+'</span></div>'; }
  var nm=c.applicant||c.name||'—';
  var addr=[p.jp_postal_code?('〒'+p.jp_postal_code):'', p.jp_address||'', p.jp_detail_address||''].filter(Boolean).join(' ');
  var tel=p.phone||p.cel_phone||p.tel_num||'';
  var ti=_tokureiTracked(c)?expInfo(_tokureiDate(c)):null;
  var h='<div class="dt-name">'+esc(nm)+'</div>';
  h+='<div class="dt-sub">'+_dv(p.applicant_name_en)+' / '+_dv(p.nationality||c.nationality)+'</div>';
  h+=_cksSchedule(c);  // ver.20260921.10
  h+='<div class="dt-sec">基本情報</div>';
  h+=row('生年月日',_dv(p.birthdate));
  h+=row('性別',_dv(p.gender));
  h+=row('国籍',_dv(p.nationality||c.nationality));
  h+='<div class="dt-sec">証明書番号</div>';
  h+=row('在留カード番号',_dv(p.residence_card));
  h+=row('パスポート番号',_dv(p.passport));
  h+=row('パスポート有効期限',_dv(p.passport_expiry));
  h+='<div class="dt-sec">連絡先</div>';
  h+=row('住所',_dv(addr));
  h+=row('母国住所',_dv(p.home_country_address));
  h+=row('電話',_dv(tel));
  h+=row('メール',_dv(p.email));
  h+='<div class="dt-sec">在留・申請</div>';
  h+=row('現在の在留資格',_dv(p.residence_status));
  h+=row('申請在留資格',_dv(c.residence_status));
  h+=row('在留期限',_dv(c.expire));
  if(ti) h+=row('特例期限',ti.txt);
  h+=row('申請種別',_dv(c.app_type));
  h+=row('登録支援機関',_dv(c.org));
  h+=row('進捗',esc(getExternalStatus(c.status)));
  if(companyShowMlit){ var _ml=getKokkoStatus(c); if(_ml) h+=row('国交省申請',esc(_ml)); }
  h+=row('受付番号',_dv(c.receipt_no));
  h+='<div class="dt-sec">発行書類</div>';
  h+='<div class="pdf-row">'
    +_pdfChip('申請中証明',_lastPdfUrl(p.application_cert_pdf_urls),'#2563eb','🪪')
    +_pdfChip('預かり証',_lastPdfUrl(p.custody_receipt_pdf_urls),'#7c3aed','📋')
    +_pdfChip('受付番号',receiptByCase[c.id]||'','#dc2626','📄')
    +_pdfChip('審査完了',shinsaByCase[c.id]||'','#16a34a','✅')
    +'</div>';
  h+='<div class="dt-sec">大房行政書士法人担当</div>';
  h+=row('部署',_dv(c.team));
  h+=row('担当',_dv(c.staff));
  return h;
}
