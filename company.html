function sbFetch(p,opts){return fetch(SUPABASE_URL+'/rest/v1/'+p,Object.assign({headers:{'apikey':SUPABASE_KEY,'Authorization':'Bearer '+SUPABASE_KEY,'Content-Type':'application/json'}},opts||{}));}
function callRpc(fn,args){return fetch(SUPABASE_URL+'/rest/v1/rpc/'+fn,{method:'POST',headers:{'apikey':SUPABASE_KEY,'Authorization':'Bearer '+SUPABASE_KEY,'Content-Type':'application/json'},body:JSON.stringify(args||{})}).then(function(r){return r.json();});}
function getParam(k){return new URLSearchParams(location.search).get(k);}
function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}

/* index.html と同一のフォルダID抽出 */
function extractDriveFolderId(url){
  if(!url) return null; url=url.trim();
  var m=url.match(/folders\/([a-zA-Z0-9_-]+)/); if(m) return m[1];
  m=url.match(/[?&]id=([a-zA-Z0-9_-]+)/); if(m) return m[1];
  m=url.match(/\/d\/([a-zA-Z0-9_-]+)/); if(m) return m[1];
  if(/^[a-zA-Z0-9_-]{10,}$/.test(url)) return url;
  return null;
}
/* index.html の generateCompanyUploadUrl と同一形式の書類アップロードURL */
function buildCompanyUploadUrl(){
  var fid=extractDriveFolderId(companyDrive);
  if(!fid) return '';
  return 'https://ofusa2026.github.io/upload/company_dataup.html?folder='+fid
    +'&company='+encodeURIComponent(companyId)
    +(companyName?'&name='+encodeURIComponent(companyName):'')
    +'&v=20260525.60';
}

function agencyColor(status){
  if(!status||status==='未設定') return '#64748b';
  if(status==='完了'||status==='完了(許可済)'||status==='申請済み'||status==='補正完了') return '#16a34a';
  if(status==='申請可能') return '#0891b2';
  if(status.indexOf('補正')>=0) return '#ef4444';
  if(status==='申請中') return '#2563eb';
  if(status==='企業確認中') return '#f59e0b';
  if(status.indexOf('大房')>=0) return '#f59e0b';
  if(status.indexOf('企業')>=0) return '#ea580c';
  return '#64748b';
}



/* 完了とみなすステータス（ダッシュボード集計用） */
function isDone(s){ return /受取|交付|完了|許可済/.test(s||''); }
/* ver.20260616.01: share.html と同一のグループ分類。発行済み・完了は「完了／審査完了」のみ（許可済・郵送交付・窓口受取は進行中に残す） */
var DONE_ST=['完了','審査完了'];
function classifyCase(c){ return DONE_ST.indexOf((c&&c.status)||'')>=0?'done':'active'; }
/* ver.20260616.01: 案件のorg(登録支援機関名)から重複なしの一覧を作る。複数機関の企業でもトークン単位で案件が分かれるため通常は1機関 */
function _distinctOrgs(arr){ var seen=[]; (arr||[]).forEach(function(c){ var o=((c&&c.org)||'').trim(); if(o&&seen.indexOf(o)<0) seen.push(o); }); return seen.join(' ・ '); }

/* 在留期限アラートの除外（本体 _KANRI_EXPIRE_EXCLUDE と同一）。申請済・審査中・交付・完了等は対象外 */
var EXPIRE_EXCLUDE=['申請済(番号待)','審査中','特活審査中','★要追完','要追完 企業不足書類待ち','要追完 人材不足書類待ち','要追完 人材と企業不足書類待ち','許可済 受取方法調整中','入管受取ステータス変更中','★郵送交付','郵送交付中','郵送交付','★窓口受取','窓口受取','窓口受取（本人）','完了','審査完了'];
function _expireTracked(c){ return c && (c.app_type||'')!=='申請なし' && EXPIRE_EXCLUDE.indexOf(c.status||'')===-1; }

/* 特例期限（本体 _KANRI_TOKUREI_INCLUDE / _kanriGetTokureiDate と同一）。申請済み等で特例期間中の案件が対象 */
var TOKUREI_INCLUDE=['審査中','特活審査中','申請済(番号待)','郵送交付','★郵送交付','窓口受取','★窓口受取','★要追完'];
function _tokureiTracked(c){ return c && (c.app_type||'')!=='申請なし' && TOKUREI_INCLUDE.indexOf(c.status||'')!==-1; }
function _tokureiDate(c){
  if(!c) return null;
  if(c.tokurei_date) return c.tokurei_date;
  if(c.expire){
    var m=String(c.expire).slice(0,10).match(/^(\d{4})-(\d{2})-(\d{2})$/); if(!m) return null;
    var d=new Date(parseInt(m[1]),parseInt(m[2])-1,parseInt(m[3])); d.setMonth(d.getMonth()+2);
    var y=d.getFullYear(),mo=d.getMonth()+1,dd=d.getDate();
    return y+'-'+(mo<10?'0'+mo:mo)+'-'+(dd<10?'0'+dd:dd);
  }
  return null;
}

var companyId='', companyName='', companyDrive='', companyOfusaStaff='', companyShowMlit=false, currentToken='', _correctPass='';

async function checkPass(){
  var v=document.getElementById('passInput').value.trim();
  document.getElementById('passErr').textContent='確認中...';
  var lr=await loadData(v);
  if(lr&&lr.passErr){ document.getElementById('passErr').textContent='パスワードが違います'; return; }
  document.getElementById('passScreen').classList.add('hide');
}

async function init(){
  var token=getParam('token');
  if(!token){ document.getElementById('main').innerHTML='<div class="error-box">URLが正しくありません。</div>'; return; }
  currentToken=token;
  try{
    var meta=await callRpc('company_view_meta',{p_token:token});
    if(!meta||!meta.ok){ document.getElementById('main').innerHTML='<div class="error-box">このURLは無効です。担当者にお問い合わせください。</div>'; return; }
    companyId=meta.company_id||'';
    companyName=meta.company_name||'';
    document.getElementById('headerOrg').textContent=companyName+' 様';
    document.title=companyName+' 様 | 所属機関マイページ';
    if(meta.has_pass){
      document.getElementById('passOrgName').textContent=companyName+' 様';
      document.getElementById('passScreen').classList.remove('hide');
      setTimeout(function(){document.getElementById('passInput').focus();},100);
      return;
    }
    await loadData('');
  }catch(e){ document.getElementById('main').innerHTML='<div class="error-box">読み込みエラー: '+esc(e.message)+'</div>'; }
}

async function loadData(pass){
  try{
    var res=await callRpc('company_view_get',{p_token:currentToken,p_pass:pass||''});
    if(!res||!res.ok){
      if(res&&res.error==='pass'){ return {passErr:true}; }
      document.getElementById('main').innerHTML='<div class="error-box">対象の情報が見つかりません。</div>'; return {ok:false};
    }
    if(res.company_id) companyId=res.company_id;
    var co=res.company||{};
    companyName=co.name||companyName; companyDrive=co.drive_url||''; companyOfusaStaff=co.ofusa_staff||''; companyShowMlit=!!co.show_mlit;
    document.getElementById('headerOrg').textContent=companyName+' 様';
    allCases=Array.isArray(res.cases)?res.cases:[];
    supportOrgName=_distinctOrgs(allCases);
    coDocs={};
    (res.co_doc_check||[]).forEach(function(row){
      var idx=row.doc_key.indexOf('::'); if(idx<0) return;
      var prefix=row.doc_key.substring(0,idx); var name=row.doc_key.substring(idx+2);
      if(!coDocs[name]) coDocs[name]={};
      coDocs[name][prefix]=row.value;
    });
    computeMissing();
    personsByCase={};
    (res.persons||[]).forEach(function(p){ personsByCase[p.case_id]=p; });
    receiptByCase={}; shinsaByCase={};
    (res.receipt||[]).forEach(function(x){ if(x.case_id&&x.drive_url&&!receiptByCase[x.case_id]) receiptByCase[x.case_id]=x.drive_url; });
    (res.shinsa||[]).forEach(function(x){ if(x.case_id&&x.drive_url&&!shinsaByCase[x.case_id]) shinsaByCase[x.case_id]=x.drive_url; });
    document.getElementById('tabs').style.display='flex';
    render();
    return {ok:true};
  }catch(e){ document.getElementById('main').innerHTML='<div class="error-box">読み込みエラー: '+esc(e.message)+'</div>'; return {ok:false}; }
}

/* チェックリストに載せる書類か（aiエントリあり、または何らかの記入あり） */
function docInList(d){ return ('ai' in d) || _hasVal(d.staff) || _hasVal(d.date) || _hasVal(d.skip); }

/* 書類ごとの状態を判定: done（提出済 または 不要）/ todo（未提出） */
/* いずれかのチェック・記入があれば done */
function docState(d){
  if(_hasVal(d.ai) || _hasVal(d.staff) || _hasVal(d.date) || _hasVal(d.skip)) return 'done';
  return 'todo';
}
function docDate(d){ return _hasVal(d.date) ? d.date : ''; }

function computeMissing(){
  missingDocCount=0;
  Object.keys(coDocs).forEach(function(name){
    if(!docInList(coDocs[name])) return;
    if(docState(coDocs[name])==='todo') missingDocCount++;
  });
  var b=document.getElementById('tabDocBadge');
  if(missingDocCount>0){ b.textContent=missingDocCount; b.classList.remove('hide'); }
  else{ b.classList.add('hide'); }
}

function switchTab(t){ currentTab=t; document.querySelectorAll('.tab').forEach(function(el){el.classList.toggle('active',el.dataset.tab===t);}); render(); }
function setPeopleGroup(g){ peopleGroup=g; render(); }

function expInfo(dateStr){
  if(!dateStr) return {txt:'—',cls:'none',days:null};
  var d=new Date(dateStr); if(isNaN(d)) return {txt:esc(dateStr),cls:'none',days:null};
  var days=Math.ceil((d-new Date())/86400000);
  var cls = days<0?'danger':(days<=90?'soon':'ok');
  var txt = dateStr + '（' + (days<0?('期限切れ '+(-days)+'日'):('残'+days+'日')) + '）';
  return {txt:txt,cls:cls,days:days};
}

function render(){
  var m=document.getElementById('main');
  var idBar='<div class="id-bar"><div class="id-co">🏢 '+esc(companyName||'')+' 様</div>'
    +(supportOrgName?'<div class="id-org">登録支援機関：<b>'+esc(supportOrgName)+'</b></div>':'')+'</div>';
  var body='';
  if(currentTab==='dashboard') body=renderDashboard();
  else if(currentTab==='docs') body=renderDocs();
  else if(currentTab==='people') body=renderPeople();
  else if(currentTab==='flow') body=renderFlow();
  else if(currentTab==='office') body=renderOffice();
  m.innerHTML=idBar+body;
}

function _caseDeadline(c){
  if(_tokureiTracked(c)){ var td=_tokureiDate(c); if(td) return {label:'特例', info:expInfo(td)}; }
  if(_expireTracked(c)) return {label:'在留', info:expInfo(c.expire)};
  return null;
}
function _dashAlertList(){
  var urg=[];
  allCases.forEach(function(c){ var d=_caseDeadline(c); if(d&&d.info.days!=null&&d.info.days<=90) urg.push({c:c,d:d}); });
  if(!urg.length) return '';
  urg.sort(function(a,b){ return a.d.info.days-b.d.info.days; });
  var open=true; try{ open=(localStorage.getItem('co_dashAlertOpen_'+currentToken)!=='0'); }catch(e){}
  var head='<div class="section-title" style="display:flex;align-items:center;justify-content:space-between;gap:8px;">'
    +'<span>\ud83d\udea8 \u671f\u9650\u304c\u8fd1\u3044\u4eba\u6750\uff08'+urg.length+'\u540d\uff09</span>'
    +'<button type="button" onclick="toggleDashAlert()" style="border:none;background:#eef2f7;color:#475569;font-size:13px;font-weight:700;border-radius:6px;padding:4px 12px;cursor:pointer;white-space:nowrap;">'+(open?'\u00d7 \u9589\u3058\u308b':'\u25bc \u8868\u793a\u3059\u308b')+'</button>'
    +'</div>';
  if(!open) return head;
  var h=head+'<div class="alert-list">';
  urg.forEach(function(u){ var c=u.c,ci=u.d.info;
    h+='<div class="alert-row" onclick="openDetail(\''+esc(c.id)+'\')"><div class="al-name">'+esc(c.applicant||c.name||'\u2014')+'</div><div class="al-meta"><span class="al-tag">'+u.d.label+'</span><span class="exp '+ci.cls+'">'+esc(ci.txt)+'</span></div></div>';
  });
  return h+'</div>';
}
function toggleDashAlert(){
  var open=true; try{ open=(localStorage.getItem('co_dashAlertOpen_'+currentToken)!=='0'); }catch(e){}
  try{ localStorage.setItem('co_dashAlertOpen_'+currentToken, open?'0':'1'); }catch(e){}
  render();
}

var _NAT_NORM={'INDONESIA':'インドネシア','VIETNAM':'ベトナム','VIET NAM':'ベトナム','MYANMAR':'ミャンマー','BURMA':'ミャンマー','CAMBODIA':'カンボジア','PHILIPPINES':'フィリピン','NEPAL':'ネパール','CHINA':'中国','THAILAND':'タイ','SRI LANKA':'スリランカ','MONGOLIA':'モンゴル','BANGLADESH':'バングラデシュ','INDIA':'インド','LAOS':'ラオス'};
function natVal(c){
  var p=personsByCase[c.id];
  var n=(p&&p.nationality&&String(p.nationality).trim())||'';
  if(!n) n=(c.nationality&&String(c.nationality).trim())||'';
  return n;
}
function _natOf(c){
  var n=natVal(c);
  if(!n) return '未設定';
  return _NAT_NORM[n.toUpperCase()]||n;
}
function renderStats(){
  if(!allCases.length) return '';
  function tally(fn){ var m={}; allCases.forEach(function(c){ var k=((fn(c)||'').trim())||'未設定'; m[k]=(m[k]||0)+1; }); return Object.keys(m).map(function(k){return [k,m[k]];}).sort(function(a,b){return b[1]-a[1];}); }
  var max=allCases.length||1;
  function bars(arr){ var s='<div>'; arr.forEach(function(x){ var pct=Math.max(4,Math.round(x[1]/max*100)); s+='<div class="stat-row"><div class="stat-k">'+esc(x[0])+'</div><div class="stat-track"><div class="stat-fill" style="width:'+pct+'%;"></div></div><div class="stat-v">'+x[1]+'</div></div>'; }); return s+'</div>'; }
  var h='<div class="section-title">📊 受入状況</div>';
  h+='<div class="stat-block"><div class="stat-title">国籍内訳</div>'+bars(tally(_natOf))+'</div>';
  h+='<div class="stat-block"><div class="stat-title">申請種別内訳</div>'+bars(tally(function(c){return c.app_type;}))+'</div>';
  return h;
}

function renderDashboard(){
  var total=allCases.length;
  var done=allCases.filter(function(c){return classifyCase(c)==='done';}).length;
  var active=total-done;
  var soon=allCases.filter(function(c){if(!_expireTracked(c))return false;var i=expInfo(c.expire);return i.days!=null&&i.days>=0&&i.days<=90;}).length;
  var expired=allCases.filter(function(c){if(!_expireTracked(c))return false;var i=expInfo(c.expire);return i.days!=null&&i.days<0;}).length;
  var h='';
  h+=_dashAlertList();
  h+=_dashHero(total,soon,expired);
  h+='<div class="cards">';
  h+='<div class="card" onclick="openList(\'all\')"><div class="lbl">全申請件数</div><div class="num">'+total+'<small> 件</small></div></div>';
  h+='<div class="card" onclick="openList(\'active\')"><div class="lbl">進行中の申請</div><div class="num">'+active+'<small> 件</small></div></div>';
  h+='<div class="card" onclick="openList(\'done\')"><div class="lbl">手続き完了</div><div class="num">'+done+'<small> 件</small></div></div>';
  h+='<div class="card '+(missingDocCount>0?'warn':'')+'" onclick="switchTab(\'docs\')"><div class="lbl">未提出の書類</div><div class="num">'+missingDocCount+'<small> 件</small></div></div>';
  h+='</div>';
  // 大房行政書士法人担当窓口（部署=案件チーム最頻値 / 担当=ofusa_staff）
  var teamCount={}; allCases.forEach(function(c){var t=(c.team||'').trim();if(t)teamCount[t]=(teamCount[t]||0)+1;});
  var topTeam='',topN=0; Object.keys(teamCount).forEach(function(t){if(teamCount[t]>topN){topN=teamCount[t];topTeam=t;}});
  if(companyOfusaStaff||topTeam){
    h+='<div class="section-title">🤝 大房行政書士法人担当窓口</div>';
    h+='<div class="contact-card">';
    h+='<div class="ct-row"><span class="ct-l">部署</span><span class="ct-v">'+esc(topTeam||'—')+'</span></div>';
    h+='<div class="ct-row"><span class="ct-l">担当</span><span class="ct-v">'+esc(companyOfusaStaff||'—')+'</span></div>';
    h+='</div>';
  }
  // 特例期限（申請済み等で特例期間中の案件）
  var tokSoon=allCases.filter(function(c){if(!_tokureiTracked(c))return false;var td=_tokureiDate(c);if(!td)return false;var d=expInfo(td).days;return d!=null&&d>=0&&d<=30;}).length;
  var tokOver=allCases.filter(function(c){if(!_tokureiTracked(c))return false;var td=_tokureiDate(c);if(!td)return false;var d=expInfo(td).days;return d!=null&&d<0;}).length;
  if(expired>0||soon>0||tokOver>0||tokSoon>0){
    h+='<div class="section-title">⏰ 期限アラート</div>';
    h+='<div class="cards">';
    if(expired>0) h+='<div class="card warn" onclick="openList(\'expired\')"><div class="lbl">在留期限切れ</div><div class="num">'+expired+'<small> 名</small></div></div>';
    if(soon>0) h+='<div class="card alert" onclick="openList(\'soon\')"><div class="lbl">在留期限 90日以内</div><div class="num">'+soon+'<small> 名</small></div></div>';
    if(tokOver>0) h+='<div class="card warn" onclick="openList(\'tokOver\')"><div class="lbl">特例期限 超過</div><div class="num">'+tokOver+'<small> 名</small></div></div>';
    if(tokSoon>0) h+='<div class="card alert" onclick="openList(\'tokSoon\')"><div class="lbl">特例期限 30日以内</div><div class="num">'+tokSoon+'<small> 名</small></div></div>';
    h+='</div>';
  }
  if(missingDocCount>0){
    h+='<div class="note">⚠️ 未提出の書類が <b>'+missingDocCount+'件</b> あります。「提出書類」タブからご確認のうえ、ご提出をお願いいたします。</div>';
  }
  h+=renderStats();
  return h;
}

function renderDocs(){
  var names=Object.keys(coDocs).filter(function(n){ return docInList(coDocs[n]); });
  if(!names.length) return '<div class="empty">提出書類リストはまだ登録されていません。</div>';
  // todo（未提出）を上に、done を下に。各内で名前順
  var order={todo:0,done:1};
  names.sort(function(a,b){
    var sa=docState(coDocs[a]),sb=docState(coDocs[b]);
    if(order[sa]!==order[sb]) return order[sa]-order[sb];
    return a.localeCompare(b,'ja');
  });
  var h='<div class="section-title">📄 御社の提出書類チェックリスト</div>';
  h+='<div class="note">大房行政書士法人でチェックが入った書類は「提出済（または不要）」になります。「未提出」の書類はご提出をお願いいたします。ご不明点は担当者までご連絡ください。</div>';
  var upUrl=buildCompanyUploadUrl();
  if(upUrl){ h+='<div><a class="upload-btn" href="'+esc(upUrl)+'" target="_blank" rel="noopener">📤 書類をアップロード</a></div>'; }
  h+='<div class="doc-co">';
  names.forEach(function(name){
    var st=docState(coDocs[name]);
    var ico = st==='done'?'✅':'⬜';
    var stTxt = st==='done'?'提出済（または不要）':'未提出';
    var stCls = st==='done'?'s-done':'s-todo';
    h+='<div class="doc-row">';
    h+='<span class="doc-ico">'+ico+'</span>';
    h+='<div class="doc-name">'+esc(name)+'</div>';
    h+='<span class="doc-state '+stCls+'">'+stTxt+'</span>';
    h+='</div>';
  });
  h+='</div>';
  return h;
}

function exportCsv(){
  var cols=['氏名','国籍','登録支援機関','申請在留資格','申請種別','分野・職種','進捗','受付番号','在留期限','特例期限','部署','担当'];
  var rows=[cols];
  allCases.forEach(function(c){
    var field=[c.applicant_field,c.job_category].filter(Boolean).join(' / ')||(c.industry||'');
    var tok=_tokureiTracked(c)?(_tokureiDate(c)||''):'';
    rows.push([c.applicant||c.name||'',natVal(c),c.org||'',c.residence_status||'',c.app_type||'',field,getExternalStatus(c.status),c.receipt_no||'',c.expire||'',tok,c.team||'',c.staff||'']);
  });
  var csv='\uFEFF'+rows.map(function(r){return r.map(function(v){v=String(v==null?'':v);return /[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v;}).join(',');}).join('\r\n');
  var blob=new Blob([csv],{type:'text/csv;charset=utf-8;'});
  var url=URL.createObjectURL(blob);
  var a=document.createElement('a'); a.href=url;
  var d=new Date(),p=function(n){return n<10?'0'+n:n;};
  a.download='申請一覧_'+d.getFullYear()+p(d.getMonth()+1)+p(d.getDate())+'.csv';
  document.body.appendChild(a); a.click(); document.body.removeChild(a); URL.revokeObjectURL(url);
}

  if(!allCases.length) return '<div class="empty">対象の人材がありません。</div>';

  var nAll=allCases.length, nActive=nAll-nDone;
  if(peopleGroup!=='all'&&peopleGroup!=='done'&&peopleGroup!=='active') peopleGroup='active';
  var rows=(peopleGroup==='all')?allCases:allCases.filter(function(c){return classifyCase(c)===peopleGroup;});

  h+='<div class="tbl-tools"><button class="tbtn" onclick="exportCsv()">⬇ CSV出力</button><button class="tbtn" onclick="window.print()">🖨 印刷</button></div>';

  h+='<div class="tbl-wrap"><table><thead><tr>'
    +'<th>氏名</th><th>国籍</th><th>登録支援機関</th><th>申請在留資格</th><th>申請種別</th><th>分野・職種</th>'
    +'<th>進捗</th><th>受付番号</th><th>在留期限</th><th>担当窓口</th><th>PDF</th>'
    +'</tr></thead><tbody>';
  rows.forEach(function(c){
    var nm=c.applicant||c.name||'—';
    var field=[c.applicant_field,c.job_category].filter(Boolean).join(' / ')||(c.industry||'—');
    var ei=expInfo(c.expire);
    h+='<tr class="people-row" onclick="openDetail(\''+esc(c.id)+'\')">';
    h+='<td><b>'+esc(nm)+'</b></td>';
    h+='<td>'+esc(natVal(c)||'—')+'</td>';
    h+='<td>'+esc(c.org||'—')+'</td>';
    h+='<td>'+esc(c.residence_status||'—')+'</td>';
    h+='<td>'+esc(c.app_type||'—')+'</td>';
    h+='<td>'+esc(field)+'</td>';
    var est=getExternalStatus(c.status);
    var stCell='<span class="badge-st" style="'+stExtStyle(est)+'">'+esc(est)+'</span>';
    if(companyShowMlit){ var ml=getKokkoStatus(c); if(ml) stCell+='<div style="font-size:9px;color:'+agencyColor(ml)+';font-weight:700;margin-top:3px;">🏗 国交省 '+esc(ml)+'</div>'; }
    h+='<td>'+stCell+'</td>';
    h+='<td>'+esc(c.receipt_no||'—')+'</td>';
    if(_tokureiTracked(c)){
      var ti=expInfo(_tokureiDate(c));
      h+='<td><div class="staff-cell"><div><span class="sl">特例</span><span class="exp '+ti.cls+'">'+esc(ti.txt)+'</span></div><div style="color:#cbd5e1;">在留 '+esc(c.expire||'—')+'</div></div></td>';
    } else {
      h+='<td><span class="exp '+ei.cls+'">'+esc(ei.txt)+'</span></td>';
    }
    h+='<td><div class="staff-cell"><div><span class="sl">部署</span>'+esc(c.team||'—')+'</div><div><span class="sl">担当</span>'+esc(c.staff||'—')+'</div></div></td>';
    h+='<td style="white-space:nowrap;">'+_rowPdfIcons(c)+'</td>';
    h+='</tr>';
  });
  h+='</tbody></table></div>';
  return h;
}

function renderFlow(){
  var groups=[
    {dur:'約1ヶ月', range:'STEP 1〜4', label:'ご準備〜申請', steps:[
      {ph:'STEP 1 ・ ヒアリング', t:'ヒアリング・必要書類のご案内', s:'担当者がヒアリングを行い、ご提出いただく書類をご案内します。'},
      {ph:'STEP 2 ・ ご提出', t:'書類のご提出', s:'「提出書類」タブの一覧に沿って、御社・人材から書類をご提出ください。'},
      {ph:'STEP 3 ・ 作成', t:'申請書類の作成・ご確認', s:'大房行政書士法人で申請書類を作成し、内容を確認します。'},

    ]},

      {ph:'STEP 6 ・ 交付', t:'許可・在留カード／認定証明書の交付', s:'許可後、在留カードまたは在留資格認定証明書が交付されます。'}
    ]}
  ];

    h+='<div class="tl">';

      n++;

        +'<div class="tl-sub">'+st.s+'</div></div>';
    });
    h+='</div>';
  });
  h+='</div>';

  return h;
}

function casesByKey(key){
  return allCases.filter(function(c){
    if(key==='all') return true;
    if(key==='active') return classifyCase(c)==='active';
    if(key==='done') return classifyCase(c)==='done';
    var ei=expInfo(c.expire);
    if(key==='expired') return _expireTracked(c)&&ei.days!=null&&ei.days<0;
    if(key==='soon') return _expireTracked(c)&&ei.days!=null&&ei.days>=0&&ei.days<=90;
    if(key==='tokOver'){ if(!_tokureiTracked(c))return false; var t=expInfo(_tokureiDate(c)); return t.days!=null&&t.days<0; }
    if(key==='tokSoon'){ if(!_tokureiTracked(c))return false; var t=expInfo(_tokureiDate(c)); return t.days!=null&&t.days>=0&&t.days<=30; }
    return false;
  });
}
var _LIST_TITLES={all:'全申請',active:'進行中の申請',done:'手続き完了',expired:'在留期限切れ',soon:'在留期限 90日以内',tokOver:'特例期限 超過',tokSoon:'特例期限 30日以内'};
function openList(key){
  var list=casesByKey(key);
  var h='<div class="dt-name">'+(_LIST_TITLES[key]||'')+'</div><div class="dt-sub">'+list.length+'件 ・ タップで詳細</div>';
  if(!list.length){ h+='<div class="empty">該当する申請はありません。</div>'; }
  else {
    h+='<div class="list-wrap">';
    list.forEach(function(c){
      var nm=c.applicant||c.name||'—';
      var sub=[c.residence_status,getExternalStatus(c.status)].filter(Boolean).join(' / ');
      h+='<div class="list-item" onclick="openDetail(\''+esc(c.id)+'\')"><div class="li-nm">'+esc(nm)+'</div><div class="li-sub">'+esc(sub)+'</div></div>';
    });
    h+='</div>';
  }
  document.getElementById('detailBody').innerHTML=h;
  document.getElementById('detailScreen').classList.remove('hide');
}
function openDetail(caseId){
  var c=allCases.filter(function(x){return x.id===caseId;})[0]; if(!c) return;
  var p=personsByCase[caseId]||{};
  document.getElementById('detailBody').innerHTML=renderDetail(c,p);
  document.getElementById('detailScreen').classList.remove('hide');
}
function closeDetail(){ document.getElementById('detailScreen').classList.add('hide'); }
function _dv(v){ return (v==null||v==='')?'—':esc(v); }

  var nm=c.applicant||c.name||'—';

  var h='<div class="dt-name">'+esc(nm)+'</div>';
  h+='<div class="dt-sub">'+_dv(p.applicant_name_en)+' / '+_dv(p.nationality||c.nationality)+'</div>';
  h+='<div class="dt-sec">基本情報</div>';
  h+=row('生年月日',_dv(p.birthdate));
  h+=row('性別',_dv(p.gender));
  h+=row('国籍',_dv(p.nationality||c.nationality));
  h+='<div class="dt-sec">証明書番号</div>';
  h+=row('在留カード番号',_dv(p.residence_card));
  h+=row('パスポート番号',_dv(p.passport));
  h+=row('パスポート有効期限',_dv(p.passport_expiry));
  h+='<div class="dt-sec">連絡先</div>';
  h+=row('住所',_dv(addr));
  h+=row('母国住所',_dv(p.home_country_address));
  h+=row('電話',_dv(tel));
  h+=row('メール',_dv(p.email));
  h+='<div class="dt-sec">在留・申請</div>';
  h+=row('現在の在留資格',_dv(p.residence_status));
  h+=row('申請在留資格',_dv(c.residence_status));
  h+=row('在留期限',_dv(c.expire));
  if(ti) h+=row('特例期限',ti.txt);
  h+=row('申請種別',_dv(c.app_type));
  h+=row('登録支援機関',_dv(c.org));
  h+=row('進捗',esc(getExternalStatus(c.status)));
  if(companyShowMlit){ var _ml=getKokkoStatus(c); if(_ml) h+=row('国交省申請',esc(_ml)); }
  h+=row('受付番号',_dv(c.receipt_no));
  h+='<div class="dt-sec">発行書類</div>';
  h+='<div class="pdf-row">'
    +_pdfChip('申請中証明',_lastPdfUrl(p.application_cert_pdf_urls),'#2563eb','🪪')
    +_pdfChip('預かり証',_lastPdfUrl(p.custody_receipt_pdf_urls),'#7c3aed','📋')
    +_pdfChip('受付番号',receiptByCase[c.id]||'','#dc2626','📄')
    +_pdfChip('審査完了',shinsaByCase[c.id]||'','#16a34a','✅')
    +'</div>';
  h+='<div class="dt-sec">大房行政書士法人担当</div>';
  h+=row('部署',_dv(c.team));
  h+=row('担当',_dv(c.staff));
  return h;
}
