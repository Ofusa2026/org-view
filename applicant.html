var FZ_KEYS=Object.keys(FZ).sort(function(a,b){return Array.from(b).length-Array.from(a).length;});
function _escCh(ch){ return ch==='&'?'&amp;':ch==='<'?'&lt;':ch==='>'?'&gt;':ch; }
function fz(text){
  if(text==null) return '';
  text=String(text);
  if(curLang!=='ja') return esc(text);
  var chars=Array.from(text), out='', i=0, n=chars.length;
  while(i<n){
    var matched=false;
    for(var k=0;k<FZ_KEYS.length;k++){
      var key=FZ_KEYS[k], kc=Array.from(key), kl=kc.length;
      if(i+kl<=n && chars.slice(i,i+kl).join('')===key){
        out+='<ruby>'+esc(key)+'<rt>'+esc(FZ[key])+'</rt></ruby>'; i+=kl; matched=true; break;
      }
    }
    if(!matched){ out+=_escCh(chars[i]); i++; }
  }
  return out;
}

/* 言語切替UI */
function renderLangSwitch(){
  var el=document.getElementById('langSwitch'); if(!el) return;
  var langs=[['ja','日本語'],['en','English'],['vi','Tiếng Việt'],['id','Indonesia'],['zh','中文'],['km','ភាសាខ្មែរ'],['my','မြန်မာ'],['th','ไทย']];
  var opts=langs.map(function(l){return '<option value="'+l[0]+'"'+(l[0]===curLang?' selected':'')+'>'+l[1]+'</option>';}).join('');
  el.innerHTML='🌐 <select id="langSel" class="lang-sel" onchange="setLang(this.value)">'+opts+'</select>';
}
function setLang(l){
  if(['ja','en','vi','id','zh','km','my','th'].indexOf(l)<0) return;
  curLang=l; try{localStorage.setItem('applicantLang',l);}catch(e){}
  document.documentElement.lang=l;
  applyStaticI18n();
  if(theCase) render();
}
function applyStaticI18n(){
  document.documentElement.lang=curLang;
  var ht=document.getElementById('hdrTitle'); if(ht) ht.innerHTML=t('header_title');
  var logo=document.querySelector('.header-logo'); if(logo) logo.innerHTML=(curLang==='ja')?fz('大房行政書士法人'):'大房行政書士法人';
  var map={status:'tab_status',docs:'tab_docs',pdf:'tab_pdf',info:'tab_info',office:'tab_office',flow:'tab_flow',sign:'tab_sign'};
  document.querySelectorAll('.tab').forEach(function(btn){
    var key=map[btn.dataset.tab]; if(!key) return;
    var l=btn.querySelector('.tab-l'); if(l) l.innerHTML=t(key);
  });
  var foot=document.querySelector('.dh-foot'); if(foot) foot.innerHTML=t('dh_foot');
  // パスワード画面
  var pm=(typeof _passMode!=='undefined')?_passMode:'enter';
  var pt=document.getElementById('passTitle'), po=document.getElementById('passOrgName'), pb=document.getElementById('passBtn'), pi2=document.getElementById('passInput2');
  if(pt) pt.textContent=(pm==='setup')?tp('pass_title_setup'):tp('pass_title_enter');
  if(pb) pb.textContent=(pm==='setup')?tp('pass_btn_set'):tp('pass_btn_login');
  if(po&&pm==='setup') po.textContent=tp('pass_setup_note');
  if(pi2) pi2.placeholder=tp('pass_input2_ph');
}

var EXPIRE_EXCLUDE=['申請済(番号待)','審査中','特活審査中','★要追完','要追完 企業不足書類待ち','要追完 人材不足書類待ち','要追完 人材と企業不足書類待ち','許可済 受取方法調整中','入管受取ステータス変更中','★郵送交付','郵送交付中','郵送交付','★窓口受取','窓口受取','窓口受取（本人）','完了','審査完了'];
function _expireTracked(c){ return c && (c.app_type||'')!=='申請なし' && EXPIRE_EXCLUDE.indexOf(c.status||'')===-1; }
var TOKUREI_INCLUDE=['審査中','特活審査中','申請済(番号待)','郵送交付','★郵送交付','窓口受取','★窓口受取','★要追完'];
function _tokureiTracked(c){ return c && (c.app_type||'')!=='申請なし' && TOKUREI_INCLUDE.indexOf(c.status||'')!==-1; }
function _tokureiDate(c){
  if(!c) return null;
  if(c.tokurei_date) return c.tokurei_date;
  if(c.expire){
    var m=String(c.expire).slice(0,10).match(/^(\d{4})-(\d{2})-(\d{2})$/); if(!m) return null;
    var d=new Date(parseInt(m[1]),parseInt(m[2])-1,parseInt(m[3])); d.setMonth(d.getMonth()+2);
    var y=d.getFullYear(),mo=d.getMonth()+1,dd=d.getDate();
    return y+'-'+(mo<10?'0'+mo:mo)+'-'+(dd<10?'0'+dd:dd);
  }
  return null;
}
function expInfo(dateStr){
  if(!dateStr) return {txt:'—',cls:'none',days:null};
  var d=new Date(dateStr); if(isNaN(d)) return {txt:(curLang==='ja'?fz(dateStr):esc(dateStr)),cls:'none',days:null};
  var days=Math.ceil((d-new Date())/86400000);
  var cls=days<0?'danger':(days<=90?'soon':'ok');
  var tail=days<0? t('exp_expired',{n:-days}) : t('exp_remain',{n:days});
  var txt=esc(dateStr)+'（'+tail+'）';
  return {txt:txt,cls:cls,days:days};
}

/* アップロードURL（index の generateUploadUrl と同一形式: zinzai_dataup） */
function extractDriveFolderId(url){
  if(!url) return null; url=url.trim();
  var m=url.match(/folders\/([a-zA-Z0-9_-]+)/); if(m) return m[1];
  m=url.match(/[?&]id=([a-zA-Z0-9_-]+)/); if(m) return m[1];
  m=url.match(/\/d\/([a-zA-Z0-9_-]+)/); if(m) return m[1];
  if(/^[a-zA-Z0-9_-]{10,}$/.test(url)) return url;
  return null;
}
function buildUploadUrl(){
  if(!theCase) return '';
  var fid=extractDriveFolderId(theCase.drive_url);
  if(!fid) return '';
  var at=(theCase.app_type||'');
  var appNorm=at.indexOf('更新')>=0?'更新':at.indexOf('変更')>=0?'変更':at.indexOf('認定')>=0?'認定':'';
  var nat=(thePerson&&thePerson.nationality)||theCase.nationality||'';
  var res=(thePerson&&(thePerson.residence_status))||theCase.residence_status||'';
  var ryugaku=String(res).indexOf('留学')>=0?'1':'';
  return 'https://ofusa2026.github.io/upload/zinzai_dataup.html?folder='+fid
    +'&case='+encodeURIComponent(theCase.id)
    +(theCase.applicant?'&name='+encodeURIComponent(theCase.applicant):'')
    +(appNorm?'&appType='+encodeURIComponent(appNorm):'')
    +(nat?'&nationality='+encodeURIComponent(nat):'')
    +(ryugaku?'&ryugaku=1':'')
    +'&v=20260525.60';
}

function savePin(token,pin){
  return callRpc('applicant_view_set_pin',{p_token:token,p_pin:pin}).then(function(r){return !!(r&&r.ok);}).catch(function(){return false;});
}
async function passSubmit(){
  var v=(document.getElementById('passInput').value||'').replace(/\D/g,'');
  var err=document.getElementById('passErr');
  if(!/^\d{4}$/.test(v)){ err.textContent=tp('pass_err_4digit'); return; }
  if(_passMode==='setup'){
    var v2=(document.getElementById('passInput2').value||'').replace(/\D/g,'');
    if(v!==v2){ err.textContent=tp('pass_err_mismatch'); return; }
    err.textContent=tp('pass_setting');
    var ok=await savePin(window._passToken,v);
    if(!ok){ err.textContent=tp('pass_set_fail'); return; }
    document.getElementById('passScreen').classList.add('hide');
    await loadData(v);
  } else {
    err.textContent=tp('pass_checking');
    var lr=await loadData(v);
    if(lr&&lr.passErr){ err.textContent=tp('pass_wrong'); return; }
    document.getElementById('passScreen').classList.add('hide');
  }
}

async function init(){
  renderLangSwitch();
  document.documentElement.lang=curLang;
  var token=getParam('token');
  if(!token){ document.getElementById('main').innerHTML='<div class="error-box">'+t('err_badurl')+'</div>'; return; }
  currentToken=token; window._passToken=token;
  try{
    var meta=await callRpc('applicant_view_meta',{p_token:token});
    if(!meta||!meta.ok){ document.getElementById('main').innerHTML='<div class="error-box">'+t('err_invalid')+'</div>'; return; }
    if(meta.has_pin){
      _passMode='enter';
      document.getElementById('passInput2').classList.add('hide');
    } else {
      _passMode='setup';
      document.getElementById('passInput2').classList.remove('hide');

async function loadData(pass){
  try{
    var res=await callRpc('applicant_view_get',{p_token:currentToken,p_pass:pass||''});
    if(!res||!res.ok){
      if(res&&res.error==='pass'){ return {passErr:true}; }
      document.getElementById('main').innerHTML='<div class="error-box">'+t('err_notfound')+'</div>'; return {ok:false};
    }
    _correctPass=pass||'';
    theCase=res.case||{};
    thePerson=res.person||{};
    applicantChangeReq=null;
    if(res.change_req!=null && res.change_req!==''){
      try{ applicantChangeReq=(typeof res.change_req==='string')?JSON.parse(res.change_req):res.change_req; }catch(e){ applicantChangeReq=null; }
    }
    signRequests=Array.isArray(res.sign_requests)?res.sign_requests:[];
    pdfCert=''; pdfCustody=''; pdfReceipt=res.pdf_receipt||''; pdfShinsa=res.pdf_shinsa||'';
    var _ac=thePerson.application_cert_pdf_urls; if(Array.isArray(_ac)&&_ac.length){ var _l1=_ac[_ac.length-1]; if(_l1&&_l1.url) pdfCert=_l1.url; }
    var _cu=thePerson.custody_receipt_pdf_urls; if(Array.isArray(_cu)&&_cu.length){ var _l2=_cu[_cu.length-1]; if(_l2&&_l2.url) pdfCustody=_l2.url; }
    hasHearingForm=!!res.has_hearing_form;
    cacheDocs=Array.isArray(res.cache_docs)?res.cache_docs:[];
    doneSet={};
    (res.doc_check||[]).forEach(function(row){
      var idx=row.doc_key.indexOf('::'); if(idx<0) return;
      var prefix=row.doc_key.substring(0,idx); var name=row.doc_key.substring(idx+2);
      var v=row.value; var truthy=(v!=null&&v!==''&&v!=='false');
      if((prefix==='staff'||prefix==='skip')&&truthy) doneSet[name]=true;
    });
    computeMissing();
    var nm=theCase.applicant||theCase.name||'';
    var samaSp=tp('sama'); samaSp=samaSp?(' '+samaSp):'';
    document.getElementById('headerName').textContent=nm+samaSp;
    document.title=nm+samaSp+' | '+tp('header_title');
    document.getElementById('tabs').style.display='flex';
    applyStaticI18n();
    render();
    return {ok:true};
  }catch(e){ document.getElementById('main').innerHTML='<div class="error-box">'+t('err_load',{n:e.message})+'</div>'; return {ok:false}; }
}

function computeMissing(){
  missingDocCount=0;

  var b=document.getElementById('tabDocBadge');

function getDocHelp(name){
  if(!name) return null;
  var k=DOC_NAME2KEY[name];
  if(!k){ var base=String(name).replace(/[（(].*$/,'').trim(); k=DOC_NAME2KEY[base]; }
  return (k&&DOC_SAMPLES[k])?DOC_SAMPLES[k]:null;
}
function openDocHelp(name){
  var d=getDocHelp(name); if(!d) return;

  var txt=(d.where&&(d.where[curLang]||d.where.en||d.where.ja))||(d.help&&(d.help[curLang]||d.help.en||d.help.ja))||'';

function docHelpInline(d){
  var img=d.image?(d.image.indexOf('http')===0?d.image:'https://ofusa2026.github.io/upload/'+d.image):'';
  var txt=(d.where&&(d.where[curLang]||d.where.en||d.where.ja))||(d.help&&(d.help[curLang]||d.help.en||d.help.ja))||'';

}

function renderDocs(){
  var h='';
  if(docDisplayList().length>0 && !docsAllDone()){
    h+='<div class="next-box"><div class="next-l">'+t('next_ask_title')+'</div><div class="next-t">'+t('next_docs',{n:missingDocCount})+'</div></div>';
  }
  h+='<div class="section-title">📄 '+t('docs_title')+'</div>';
  h+='<div class="note">'+t('docs_note')+'</div>';
  var upUrl=buildUploadUrl();
  if(upUrl){ h+='<div><a class="upload-btn" href="'+esc(upUrl)+'" target="_blank" rel="noopener">📤 '+t('btn_upload')+'</a></div>'; }
  var list=docDisplayList();
  if(!list.length){ h+='<div class="empty">'+t('docs_empty')+'</div>'; return h; }
  list=list.slice().sort(function(a,b){ var da=isDocDone(a)?1:0, db=isDocDone(b)?1:0; if(da!==db)return da-db; return String(a.l).localeCompare(String(b.l),'ja'); });
  h+='<div class="doc-co">';
  list.forEach(function(d){
    var done=isDocDone(d);
    var ico=done?'✅':'⬜';
    var stTxt=done?t('doc_done_state'):t('doc_todo_state');
    var stCls=done?'s-done':'s-todo';
    var reqMark=(!done && d.r)?' <span style="color:#dc2626;font-size:10px;font-weight:800;">'+t('doc_required')+'</span>':'';
    var nameHtml=(curLang==='ja')?fz(d.l):esc(d.l);
    var hd=getDocHelp(d.l);
    h+='<div class="doc-item">';
    h+='<div class="doc-row"><span class="doc-ico">'+ico+'</span><div class="doc-name">'+nameHtml+reqMark+'</div><span class="doc-state '+stCls+'">'+stTxt+'</span></div>';
    if(String(d.l).indexOf('専門級')>=0){ h+='<div class="doc-subnote">'+t('note_specialist')+'</div>'; }
    if(hd){ h+=docHelpInline(hd); }
    h+='</div>';
  });
  h+='</div>';
  return h;
}

function _pdfBtn(label,url,color,icon){
  if(url) return '<a class="pdf-btn" style="background:'+color+';" href="'+esc(url)+'" target="_blank" rel="noopener">'+icon+' '+label+'</a>';
  return '<span class="pdf-btn pdf-none">'+icon+' '+label+'（'+t('pdf_unissued')+'）</span>';
}
function _signDone(s){ return !!(s && (s.signed_at || s.status==='signed' || s.status==='confirmed')); }
function _fmtDateTime(v){ if(!v) return ''; return String(v).replace('T',' ').slice(0,16); }
function renderSign(){
  var h='<div class="section-title">'+t('sign_title')+'</div>';
  h+='<div class="note">'+t('sign_note')+'</div>';
  var list=signRequests.filter(_signDone);
  if(!list.length){ h+='<div class="empty">'+t('sign_empty')+'</div>'; return h; }
  list.sort(function(a,b){ return String(b.signed_at||'').localeCompare(String(a.signed_at||'')); });
  h+='<div class="doc-co">';
  list.forEach(function(s){
    var nm=s.doc_type||tp('sign_doc_default');
    var nameHtml=(curLang==='ja')?fz(nm):esc(nm);
    h+='<div class="doc-item"><div class="doc-row"><span class="doc-ico">✅</span><div class="doc-name">'+nameHtml+'</div><span class="doc-state s-done">'+t('sign_signed')+'</span></div>';
    var meta=[];
    if(s.signer_name) meta.push(t('sign_signer')+'：'+esc(s.signer_name));
    if(s.signed_at) meta.push(t('sign_date')+'：'+esc(_fmtDateTime(s.signed_at)));
    if(meta.length) h+='<div class="sign-meta">'+meta.join('　')+'</div>';
    var _sdocs=(s.docs&&Array.isArray(s.docs))?s.docs.filter(function(d){return d&&d.signed_pdf_url;}):[];
    if(_sdocs.length){
      h+='<div class="sign-act">';
      _sdocs.forEach(function(d){
        var _lbl=(_sdocs.length>1&&d.name)?('📄 '+esc(d.name)):('📄 '+t('sign_view_pdf'));
        h+='<a class="sign-btn view" href="'+esc(d.signed_pdf_url)+'" target="_blank" rel="noopener" style="margin-right:6px;margin-bottom:6px;">'+_lbl+'</a>';
      });
      h+='</div>';
    } else if(s.signed_pdf_url){
      h+='<div class="sign-act"><a class="sign-btn view" href="'+esc(s.signed_pdf_url)+'" target="_blank" rel="noopener">📄 '+t('sign_view_pdf')+'</a></div>';
    } else {
      h+='<div class="sign-act"><span class="sign-saving">⏳ '+t('sign_saving')+'</span></div>';
    }
    h+='</div>';
  });
  h+='</div>';
  return h;
}

function changeReqHtml(){
  var has=!!(applicantChangeReq && applicantChangeReq.text);
  var curText=has?String(applicantChangeReq.text):'';
  var h='<div class="cr-box">';
  h+='<div class="cr-title">✏️ '+t('cr_title')+'</div>';
  h+='<div class="cr-desc">'+t('cr_desc')+'</div>';
  if(has){
    h+='<div class="cr-sent-badge">✓ '+t('cr_submitted_badge')+'</div>';
    if(applicantChangeReq.requested_at){ h+='<div class="cr-sent-at">'+t('cr_submitted_at')+'：'+esc(String(applicantChangeReq.requested_at))+'</div>'; }
  }
  h+='<textarea id="crText" class="cr-ta" placeholder="'+esc(tp('cr_placeholder'))+'">'+esc(curText)+'</textarea>';
  h+='<div class="cr-btns">';
  h+='<button class="cr-btn send" onclick="sendChangeReq()">'+(has?('🔄 '+t('cr_update')):('📨 '+t('cr_send')))+'</button>';
  if(has){ h+='<button class="cr-btn cancel" onclick="cancelChangeReq()">🗑 '+t('cr_cancel')+'</button>'; }
  h+='</div>';
  if(has){ h+='<div class="cr-pending">⏳ '+t('cr_pending_note')+'</div>'; }
  h+='<div id="crMsg" class="cr-msg"></div>';
  h+='</div>';
  return h;
}

function _crMsg(msg,color){ var el=document.getElementById('crMsg'); if(el){ el.textContent=msg; el.style.color=color||'#dc2626'; } }

function sendChangeReq(){
  var el=document.getElementById('crText'); if(!el) return;
  var txt=(el.value||'').trim();
  if(!txt){ _crMsg(tp('cr_empty'),'#dc2626'); return; }
  _crMsg(tp('cr_sending'),'#64748b');
  callRpc('applicant_view_change_req',{p_token:currentToken,p_pass:_correctPass,p_text:txt}).then(function(r){
    var ra=(r&&(r.requested_at||r.requestedAt))||'';
    applicantChangeReq={text:txt,requested_at:ra,status:'pending'};
    render();
  }).catch(function(){ _crMsg(tp('cr_send_fail'),'#dc2626'); });
}

function cancelChangeReq(){
  if(!window.confirm(tp('cr_cancel_confirm'))) return;
  _crMsg(tp('cr_sending'),'#64748b');
  callRpc('applicant_view_change_req',{p_token:currentToken,p_pass:_correctPass,p_text:''}).then(function(){
    applicantChangeReq=null;
    render();
  }).catch(function(){ _crMsg(tp('cr_send_fail'),'#dc2626'); });
}

function renderFlow(){
  var groups=[
    {dur:t('flow_g1_dur'), range:'STEP 1〜4', label:t('flow_g1_label'), steps:[
      {ph:t('step1_ph'), t:t('step1_t'), s:t('step1_s')},
      {ph:t('step2_ph'), t:t('step2_t'), s:t('step2_s')},
      {ph:t('step3_ph'), t:t('step3_t'), s:t('step3_s')},
      {ph:t('step4_ph'), t:t('step4_t'), s:t('step4_s')}
    ]},
    {dur:t('flow_g2_dur'), range:'STEP 5〜6', label:t('flow_g2_label'), steps:[
      {ph:t('step5_ph'), t:t('step5_t'), s:t('step5_s')},
      {ph:t('step6_ph'), t:t('step6_t'), s:t('step6_s')}
    ]}
  ];
  var h='<div class="section-title">📌 '+t('flow_title')+'</div>';
  h+='<div class="info-card" style="padding:18px 18px 12px;">';
  var n=0;
  groups.forEach(function(g){
    h+='<div class="tl-grp"><span class="tl-dur">⏱ '+t('flow_dur_prefix')+' '+g.dur+'</span><span class="tl-grp-l">'+g.label+'（'+esc(g.range)+'）</span></div>';
    h+='<div class="tl">';
    g.steps.forEach(function(st){
      n++;
      h+='<div class="tl-item"><div class="tl-dot">'+n+'</div>'
        +'<div class="tl-phase">'+st.ph+'</div>'
        +'<div class="tl-ttl">'+st.t+'</div>'
        +'<div class="tl-sub">'+st.s+'</div></div>';
    });
    h+='</div>';
  });
  h+='</div>';
  h+='<div class="note">'+t('flow_note')+'</div>';
  return h;
}
