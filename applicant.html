};
function getExternalStatus(s){return ST_EXTERNAL[s]||s||'未着手';}
function stExtStyle(ext){ var s=ST_EXT_COL[ext]; if(!s) return 'background:#f1f5f9;color:#475569;border-color:#e2e8f0;'; return 'background:'+s.bg+';color:'+s.col+';border-color:'+s.bor+';'; }

/* 国交省申請ステータス（実データ: cases.other_agencies.kokkoSho） */
function getKokkoStatus(c){
  var oa=c.other_agencies; if(!oa||typeof oa!=='object') return '';
  if(!oa.kokkoSho || oa.kokkoSho_fuyo) return '';
  return oa.kokkoSho_status || '未設定';
}
function agencyColor(status){
  if(!status||status==='未設定') return '#64748b';
  if(status==='完了'||status==='完了(許可済)'||status==='申請済み'||status==='補正完了') return '#16a34a';
  if(status==='申請可能') return '#0891b2';
  if(status.indexOf('補正')>=0) return '#ef4444';
  if(status==='申請中') return '#2563eb';
  if(status==='企業確認中') return '#f59e0b';
  if(status.indexOf('大房')>=0) return '#f59e0b';
  if(status.indexOf('企業')>=0) return '#ea580c';
  return '#64748b';
}

/* 在留期限・特例期限（company.html と同一ロジック） */
var EXPIRE_EXCLUDE=['申請済(番号待)','審査中','特活審査中','★要追完','要追完 企業不足書類待ち','要追完 人材不足書類待ち','要追完 人材と企業不足書類待ち','許可済 受取方法調整中','入管受取ステータス変更中','★郵送交付','郵送交付中','郵送交付','★窓口受取','窓口受取','窓口受取（本人）','完了','審査完了'];
function _expireTracked(c){ return c && (c.app_type||'')!=='申請なし' && EXPIRE_EXCLUDE.indexOf(c.status||'')===-1; }
var TOKUREI_INCLUDE=['審査中','特活審査中','申請済(番号待)','郵送交付','★郵送交付','窓口受取','★窓口受取','★要追完'];
function _tokureiTracked(c){ return c && (c.app_type||'')!=='申請なし' && TOKUREI_INCLUDE.indexOf(c.status||'')!==-1; }
function _tokureiDate(c){
  if(!c) return null;
  if(c.tokurei_date) return c.tokurei_date;
  if(c.expire){
    var m=String(c.expire).slice(0,10).match(/^(\d{4})-(\d{2})-(\d{2})$/); if(!m) return null;
    var d=new Date(parseInt(m[1]),parseInt(m[2])-1,parseInt(m[3])); d.setMonth(d.getMonth()+2);
    var y=d.getFullYear(),mo=d.getMonth()+1,dd=d.getDate();
    return y+'-'+(mo<10?'0'+mo:mo)+'-'+(dd<10?'0'+dd:dd);
  }
  return null;
}
function expInfo(dateStr){
  if(!dateStr) return {txt:'—',cls:'none',days:null};
  var d=new Date(dateStr); if(isNaN(d)) return {txt:esc(dateStr),cls:'none',days:null};
  var days=Math.ceil((d-new Date())/86400000);
  var cls=days<0?'danger':(days<=90?'soon':'ok');
  var txt=dateStr+'（'+(days<0?('期限切れ '+(-days)+'日'):('残'+days+'日'))+'）';
  return {txt:txt,cls:cls,days:days};
}

/* アップロードURL（index の generateUploadUrl と同一形式: zinzai_dataup） */
function extractDriveFolderId(url){
  if(!url) return null; url=url.trim();
  var m=url.match(/folders\/([a-zA-Z0-9_-]+)/); if(m) return m[1];
  m=url.match(/[?&]id=([a-zA-Z0-9_-]+)/); if(m) return m[1];
  m=url.match(/\/d\/([a-zA-Z0-9_-]+)/); if(m) return m[1];
  if(/^[a-zA-Z0-9_-]{10,}$/.test(url)) return url;
  return null;
}
function buildUploadUrl(){
  if(!theCase) return '';
  var fid=extractDriveFolderId(theCase.drive_url);
  if(!fid) return '';
  var at=(theCase.app_type||'');
  var appNorm=at.indexOf('更新')>=0?'更新':at.indexOf('変更')>=0?'変更':at.indexOf('認定')>=0?'認定':'';
  var nat=(thePerson&&thePerson.nationality)||theCase.nationality||'';
  var res=(thePerson&&(thePerson.residence_status))||theCase.residence_status||'';
  var ryugaku=String(res).indexOf('留学')>=0?'1':'';
  return 'https://ofusa2026.github.io/upload/zinzai_dataup.html?folder='+fid
    +'&case='+encodeURIComponent(theCase.id)
    +(theCase.applicant?'&name='+encodeURIComponent(theCase.applicant):'')
    +(appNorm?'&appType='+encodeURIComponent(appNorm):'')
    +(nat?'&nationality='+encodeURIComponent(nat):'')
    +(ryugaku?'&ryugaku=1':'')
    +'&v=20260525.60';
}

function _hasVal(v){ return v!=null && v!=='' && v!=='false'; }

var theCase=null, thePerson={}, cacheDocs=[], doneSet={}, missingDocCount=0, currentTab='status', currentToken='', _correctPass='';

function checkPass(){
  var v=document.getElementById('passInput').value.trim();
  if(v===_correctPass){ document.getElementById('passScreen').classList.add('hide'); loadData(); }
  else { document.getElementById('passErr').textContent='パスワードが違います'; }
}

async function init(){
  var token=getParam('token');
  if(!token){ document.getElementById('main').innerHTML='<div class="error-box">URLが正しくありません。</div>'; return; }
  currentToken=token;
  try{
    var r=await sbFetch('settings?key=eq.'+encodeURIComponent('applicant_view_token_'+token)+'&select=value');
    var sd=await r.json();
    if(!sd||!sd.length){ document.getElementById('main').innerHTML='<div class="error-box">このURLは無効です。担当者にお問い合わせください。</div>'; return; }
    var caseId=sd[0].value;
    var rp=await sbFetch('settings?key=eq.'+encodeURIComponent('applicant_view_pass_'+token)+'&select=value');
    var pd=await rp.json();
    var pass=(pd&&pd.length)?pd[0].value:'';
    window._caseId=caseId;
    if(pass){
      _correctPass=pass;
      document.getElementById('passOrgName').textContent='';
      document.getElementById('passScreen').classList.remove('hide');
      setTimeout(function(){document.getElementById('passInput').focus();},100);
      return;
    }
    await loadData();
  }catch(e){ document.getElementById('main').innerHTML='<div class="error-box">読み込みエラー: '+esc(e.message)+'</div>'; }
}

async function loadData(){
  try{
    var caseId=window._caseId;
    var sel='id,applicant,name,nationality,residence_status,current_status,status,app_type,applicant_field,job_category,industry,receipt_no,receipt_date,shinsa_date,expire,tokurei_date,drive_url,team,staff,other_agencies';
    var rc=await sbFetch('cases?id=eq.'+encodeURIComponent(caseId)+'&select='+sel);
    var cc=await rc.json();
    if(!cc||!cc.length){ document.getElementById('main').innerHTML='<div class="error-box">対象の申請が見つかりません。</div>'; return; }
    theCase=cc[0];
    var pf='applicant_name_en,residence_card,passport,passport_expiry,birthdate,gender,nationality,jp_postal_code,jp_address,jp_detail_address,home_country_address,phone,cel_phone,tel_num,email,residence_status';
    var rpe=await sbFetch('persons?case_id=eq.'+encodeURIComponent(caseId)+'&select='+pf);
    var pe=await rpe.json();
    thePerson=(pe&&pe.length)?pe[0]:{};
    // 提出書類リスト＝アップロード画面と同じ正規リスト（upload_docs_cache）。提出済判定は doc_check ライブ
    cacheDocs=[];
    var rcd=await sbFetch('upload_docs_cache?case_id=eq.'+encodeURIComponent(caseId)+'&kind=eq.person&select=docs');
    var cdd=await rcd.json();
    if(cdd&&cdd.length&&Array.isArray(cdd[0].docs)) cacheDocs=cdd[0].docs;
    doneSet={};
    var rd=await sbFetch('doc_check?case_id=eq.'+encodeURIComponent(caseId)+'&select=doc_key,value&limit=2000');
    var dr=await rd.json();
    (dr||[]).forEach(function(row){
      var idx=row.doc_key.indexOf('::'); if(idx<0) return;
      var prefix=row.doc_key.substring(0,idx); var name=row.doc_key.substring(idx+2);
      var v=row.value; var truthy=(v!=null&&v!==''&&v!=='false');
      if((prefix==='staff'||prefix==='skip')&&truthy) doneSet[name]=true;
    });
    computeMissing();
    var nm=theCase.applicant||theCase.name||'';
    document.getElementById('headerName').textContent=nm+' 様';
    document.title=nm+' 様 | 提出書類・進捗確認';
    document.getElementById('tabs').style.display='flex';
    render();
  }catch(e){ document.getElementById('main').innerHTML='<div class="error-box">読み込みエラー: '+esc(e.message)+'</div>'; }
}

function docDisplayList(){ return cacheDocs.filter(function(d){ return d && d.l && d.l!=='その他'; }); }
function isDocDone(d){ return !!doneSet[d.l] || !!d.done; }
function computeMissing(){
  missingDocCount=0;
  docDisplayList().forEach(function(d){ if(!isDocDone(d)) missingDocCount++; });
  var b=document.getElementById('tabDocBadge');
  if(missingDocCount>0){ b.textContent=missingDocCount; b.classList.remove('hide'); } else { b.classList.add('hide'); }
}

function switchTab(t){ currentTab=t; document.querySelectorAll('.tab').forEach(function(el){el.classList.toggle('active',el.dataset.tab===t);}); render(); }

function render(){
  var m=document.getElementById('main');
  if(currentTab==='status') m.innerHTML=renderStatus();
  else if(currentTab==='docs') m.innerHTML=renderDocs();
  else if(currentTab==='info') m.innerHTML=renderInfo();
  else if(currentTab==='flow') m.innerHTML=renderFlow();
}

function renderStatus(){
  var c=theCase;
  var est=getExternalStatus(c.status);
  var h='<div class="phase-card">';
  h+='<div class="phase-lbl">現在の進捗</div>';
  h+='<div class="phase-st" style="'+stExtStyle(est)+'">'+esc(est)+'</div>';
  var ml=getKokkoStatus(c);
  if(ml) h+='<div class="phase-mlit" style="color:'+agencyColor(ml)+';">🏗 国交省 '+esc(ml)+'</div>';
  h+='</div>';
  // 期限
  var cards='';
  var ei=expInfo(c.expire);
  if(_tokureiTracked(c)){
    var ti=expInfo(_tokureiDate(c));
    cards+='<div class="card '+(ti.cls==='danger'?'warn':(ti.cls==='soon'?'alert':''))+'"><div class="lbl">特例期限</div><div class="num"><span class="exp '+ti.cls+'">'+esc(ti.txt)+'</span></div></div>';
    cards+='<div class="card"><div class="lbl">在留期限</div><div class="num" style="color:#94a3b8;">'+_dv(c.expire)+'</div></div>';
  } else {
    cards+='<div class="card '+(ei.cls==='danger'?'warn':(ei.cls==='soon'?'alert':''))+'"><div class="lbl">在留期限</div><div class="num"><span class="exp '+ei.cls+'">'+esc(ei.txt)+'</span></div></div>';
  }
  h+='<div class="cards">'+cards+'</div>';
  // 申請情報
  h+='<div class="info-card">';
  h+='<div class="dt-row"><span class="dt-l">現在の在留資格</span><span class="dt-v">'+_dv((thePerson&&thePerson.residence_status)||c.current_status)+'</span></div>';
  h+='<div class="dt-row"><span class="dt-l">申請在留資格</span><span class="dt-v">'+_dv(c.residence_status)+'</span></div>';
  h+='<div class="dt-row"><span class="dt-l">申請種別</span><span class="dt-v">'+_dv(c.app_type)+'</span></div>';
  h+='<div class="dt-row"><span class="dt-l">分野・職種</span><span class="dt-v">'+_dv([c.applicant_field,c.job_category].filter(Boolean).join(' / ')||c.industry)+'</span></div>';
  h+='<div class="dt-row"><span class="dt-l">受付番号</span><span class="dt-v">'+_dv(c.receipt_no)+'</span></div>';
  h+='<div class="dt-row"><span class="dt-l">審査完了</span><span class="dt-v">'+_dv(c.shinsa_date)+'</span></div>';
  h+='</div>';
  // OFUSA担当
  if(c.team||c.staff){
    h+='<div class="section-title" style="margin-top:16px;">🤝 OFUSA担当窓口</div>';
    h+='<div class="contact-card">';
    h+='<div class="ct-row"><span class="ct-l">部署</span><span class="ct-v">'+_dv(c.team)+'</span></div>';
    h+='<div class="ct-row"><span class="ct-l">担当</span><span class="ct-v">'+_dv(c.staff)+'</span></div>';
    h+='</div>';
  }
  if(missingDocCount>0){
    h+='<div class="note">⚠️ 未提出の書類が <b>'+missingDocCount+'件</b> あります。「提出書類」タブからご確認のうえ、ご提出をお願いいたします。</div>';
  }
  return h;
}

function renderDocs(){
  var h='<div class="section-title">📄 あなたの提出書類</div>';
  h+='<div class="note">OFUSAでチェックが入った書類は「提出済（または不要）」になります。「未提出」の書類はご提出をお願いいたします。ご不明点は担当者までご連絡ください。</div>';
  var upUrl=buildUploadUrl();
  if(upUrl){ h+='<div><a class="upload-btn" href="'+esc(upUrl)+'" target="_blank" rel="noopener">📤 書類をアップロード</a></div>'; }
  var list=docDisplayList();
  if(!list.length){ h+='<div class="empty">提出書類リストはまだ準備中です。担当者にお問い合わせください。</div>'; return h; }
  list=list.slice().sort(function(a,b){ var da=isDocDone(a)?1:0, db=isDocDone(b)?1:0; if(da!==db)return da-db; return String(a.l).localeCompare(String(b.l),'ja'); });
  h+='<div class="doc-co">';
  list.forEach(function(d){
    var done=isDocDone(d);
    var ico=done?'✅':'⬜';
    var stTxt=done?'提出済（または不要）':'未提出';
    var stCls=done?'s-done':'s-todo';
    var reqMark=(!done && d.r)?' <span style="color:#dc2626;font-size:10px;font-weight:800;">必須</span>':'';
    h+='<div class="doc-row"><span class="doc-ico">'+ico+'</span><div class="doc-name">'+esc(d.l)+reqMark+'</div><span class="doc-state '+stCls+'">'+stTxt+'</span></div>';
  });
  h+='</div>';
  return h;
}

function renderInfo(){
  var c=theCase, p=thePerson;
  function row(l,v){ return '<div class="dt-row"><span class="dt-l">'+l+'</span><span class="dt-v">'+v+'</span></div>'; }
  var addr=[p.jp_postal_code?('〒'+p.jp_postal_code):'',p.jp_address||'',p.jp_detail_address||''].filter(Boolean).join(' ');
  var tel=p.phone||p.cel_phone||p.tel_num||'';
  var h='<div class="section-title">🪪 本人情報</div>';
  h+='<div class="info-card">';
  h+='<div class="dt-sec">基本情報</div>';
  h+=row('氏名',_dv(c.applicant||c.name));
  h+=row('生年月日',_dv(p.birthdate));
  h+=row('性別',_dv(p.gender));
  h+=row('国籍',_dv(c.nationality||p.nationality));
  h+='<div class="dt-sec">証明書番号</div>';
  h+=row('在留カード番号',_dv(p.residence_card));
  h+=row('パスポート番号',_dv(p.passport));
  h+=row('パスポート有効期限',_dv(p.passport_expiry));
  h+='<div class="dt-sec">連絡先</div>';
  h+=row('住所',_dv(addr));
  h+=row('母国住所',_dv(p.home_country_address));
  h+=row('電話',_dv(tel));
  h+=row('メール',_dv(p.email));
  h+='</div>';
  h+='<div class="note">内容に誤りがある場合は、担当者までご連絡ください。</div>';
  return h;
}

function renderFlow(){
  return '<div class="section-title">📌 申請の流れ</div>'
    +'<div class="info-card flow" style="padding:16px 20px;"><ol>'
    +'<li>ヒアリング・必要書類のご案内</li>'
    +'<li>書類のご提出（「提出書類」タブ参照）</li>'
    +'<li>OFUSAにて申請書類作成・ご確認</li>'
    +'<li>入管へ申請（受付番号の発行）</li>'
    +'<li>審査</li>'
    +'<li>許可・在留カード/認定証明書の交付</li>'
    +'</ol></div>'
    +'<div class="note">現在の進捗は「進捗」タブでご確認いただけます。</div>';
}

init();
</script>
</body>
</html>
