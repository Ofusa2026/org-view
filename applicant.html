var SUPABASE_URL='https://ehwlgbwpycglmopiqyty.supabase.co';

function callRpc(fn,args){return fetch(SUPABASE_URL+'/rest/v1/rpc/'+fn,{method:'POST',headers:{'apikey':SUPABASE_KEY,'Authorization':'Bearer '+SUPABASE_KEY,'Content-Type':'application/json'},body:JSON.stringify(args||{})}).then(function(r){return r.json();});}

/* 外部ステータス変換（share と同一・流し込み） */

  '人材書類待ち':'企業押印ご対応・書類収集・申請準備',
  '企業書類待ち':'企業押印ご対応・書類収集・申請準備',
  'スキャン書類作成':'企業押印ご対応・書類収集・申請準備',
  '★申請':'企業押印ご対応・書類収集・申請準備',
  // ver.20260603.10: 未マッピングだったステータスを追加（取引先側で内部用語のまま見えていた問題を解消）
  '申請':'企業押印ご対応・書類収集・申請準備',
  '★申請(不足あり)':'企業押印ご対応・書類収集・申請準備',
  '★申請 (不足あり)':'企業押印ご対応・書類収集・申請準備',
  '申請ステイ':'企業押印ご対応・書類収集・申請準備',
  '申請ステイ(不足あり)':'企業押印ご対応・書類収集・申請準備',

};
// 外部ステータスごとの色（バッジ用）
var ST_EXT_COL={
  '雇用条件作成・企業確認':{bg:'#eff6ff',col:'#2563eb',bor:'#93c5fd'},
  '申請人サイン対応':{bg:'#fdf4ff',col:'#a21caf',bor:'#e9d5ff'},

  '審査中':{bg:'#fef3c7',col:'#b45309',bor:'#fcd34d'},

  '新在留カード(または認定証)発行済み':{bg:'#dcfce7',col:'#15803d',bor:'#86efac'}
};
function getExternalStatus(s){return ST_EXTERNAL[s]||s||'未着手';}
function stExtStyle(ext){ var s=ST_EXT_COL[ext]; if(!s) return 'background:#f1f5f9;color:#475569;border-color:#e2e8f0;'; return 'background:'+s.bg+';color:'+s.col+';border-color:'+s.bor+';'; }

/* 国交省申請ステータス（実データ: cases.other_agencies.kokkoSho） */
function getKokkoStatus(c){
  var oa=c.other_agencies; if(!oa||typeof oa!=='object') return '';
  if(!oa.kokkoSho || oa.kokkoSho_fuyo) return '';
  return oa.kokkoSho_status || '未設定';
}
function agencyColor(status){
  if(!status||status==='未設定') return '#64748b';
  if(status==='完了'||status==='完了(許可済)'||status==='申請済み'||status==='補正完了') return '#16a34a';
  if(status==='申請可能') return '#0891b2';
  if(status.indexOf('補正')>=0) return '#ef4444';
  if(status==='申請中') return '#2563eb';
  if(status==='企業確認中') return '#f59e0b';
  if(status.indexOf('大房')>=0) return '#f59e0b';
  if(status.indexOf('企業')>=0) return '#ea580c';
  return '#64748b';
}

/* 在留期限・特例期限（company.html と同一ロジック） */
var EXPIRE_EXCLUDE=['申請済(番号待)','審査中','特活審査中','★要追完','要追完 企業不足書類待ち','要追完 人材不足書類待ち','要追完 人材と企業不足書類待ち','許可済 受取方法調整中','入管受取ステータス変更中','★郵送交付','郵送交付中','郵送交付','★窓口受取','窓口受取','窓口受取（本人）','完了','審査完了'];
function _expireTracked(c){ return c && (c.app_type||'')!=='申請なし' && EXPIRE_EXCLUDE.indexOf(c.status||'')===-1; }
var TOKUREI_INCLUDE=['審査中','特活審査中','申請済(番号待)','郵送交付','★郵送交付','窓口受取','★窓口受取','★要追完'];
function _tokureiTracked(c){ return c && (c.app_type||'')!=='申請なし' && TOKUREI_INCLUDE.indexOf(c.status||'')!==-1; }
function _tokureiDate(c){
  if(!c) return null;
  if(c.tokurei_date) return c.tokurei_date;
  if(c.expire){
    var m=String(c.expire).slice(0,10).match(/^(\d{4})-(\d{2})-(\d{2})$/); if(!m) return null;
    var d=new Date(parseInt(m[1]),parseInt(m[2])-1,parseInt(m[3])); d.setMonth(d.getMonth()+2);
    var y=d.getFullYear(),mo=d.getMonth()+1,dd=d.getDate();
    return y+'-'+(mo<10?'0'+mo:mo)+'-'+(dd<10?'0'+dd:dd);
  }
  return null;
}
function expInfo(dateStr){
  if(!dateStr) return {txt:'—',cls:'none',days:null};
  var d=new Date(dateStr); if(isNaN(d)) return {txt:esc(dateStr),cls:'none',days:null};
  var days=Math.ceil((d-new Date())/86400000);
  var cls=days<0?'danger':(days<=90?'soon':'ok');
  var txt=dateStr+'（'+(days<0?('期限切れ '+(-days)+'日'):('残'+days+'日'))+'）';
  return {txt:txt,cls:cls,days:days};
}

/* アップロードURL（index の generateUploadUrl と同一形式: zinzai_dataup） */
function extractDriveFolderId(url){
  if(!url) return null; url=url.trim();
  var m=url.match(/folders\/([a-zA-Z0-9_-]+)/); if(m) return m[1];
  m=url.match(/[?&]id=([a-zA-Z0-9_-]+)/); if(m) return m[1];
  m=url.match(/\/d\/([a-zA-Z0-9_-]+)/); if(m) return m[1];
  if(/^[a-zA-Z0-9_-]{10,}$/.test(url)) return url;
  return null;
}
function buildUploadUrl(){
  if(!theCase) return '';
  var fid=extractDriveFolderId(theCase.drive_url);
  if(!fid) return '';
  var at=(theCase.app_type||'');
  var appNorm=at.indexOf('更新')>=0?'更新':at.indexOf('変更')>=0?'変更':at.indexOf('認定')>=0?'認定':'';
  var nat=(thePerson&&thePerson.nationality)||theCase.nationality||'';
  var res=(thePerson&&(thePerson.residence_status))||theCase.residence_status||'';
  var ryugaku=String(res).indexOf('留学')>=0?'1':'';
  return 'https://ofusa2026.github.io/upload/zinzai_dataup.html?folder='+fid
    +'&case='+encodeURIComponent(theCase.id)
    +(theCase.applicant?'&name='+encodeURIComponent(theCase.applicant):'')
    +(appNorm?'&appType='+encodeURIComponent(appNorm):'')
    +(nat?'&nationality='+encodeURIComponent(nat):'')
    +(ryugaku?'&ryugaku=1':'')
    +'&v=20260525.60';
}

var theCase=null, thePerson={}, cacheDocs=[], doneSet={}, missingDocCount=0, pdfCert='', pdfCustody='', pdfReceipt='', pdfShinsa='', hasHearingForm=false, _passMode='enter', currentTab='status', currentToken='', _correctPass='';

function savePin(token,pin){
  return callRpc('applicant_view_set_pin',{p_token:token,p_pin:pin}).then(function(r){return !!(r&&r.ok);}).catch(function(){return false;});
}
async function passSubmit(){
  var v=(document.getElementById('passInput').value||'').replace(/\D/g,'');
  var err=document.getElementById('passErr');
  if(!/^\d{4}$/.test(v)){ err.textContent='4桁の数字を入力してください'; return; }
  if(_passMode==='setup'){
    var v2=(document.getElementById('passInput2').value||'').replace(/\D/g,'');
    if(v!==v2){ err.textContent='確認用と一致しません'; return; }
    err.textContent='設定中...';
    var ok=await savePin(window._passToken,v);
    if(!ok){ err.textContent='設定に失敗しました。通信環境をご確認ください'; return; }
    document.getElementById('passScreen').classList.add('hide');
    await loadData(v);
  } else {
    err.textContent='確認中...';
    var lr=await loadData(v);
    if(lr&&lr.passErr){ err.textContent='パスワードが違います'; return; }
    document.getElementById('passScreen').classList.add('hide');
  }
}

async function init(){
  var token=getParam('token');
  if(!token){ document.getElementById('main').innerHTML='<div class="error-box">URLが正しくありません。</div>'; return; }
  currentToken=token; window._passToken=token;
  try{
    var meta=await callRpc('applicant_view_meta',{p_token:token});
    if(!meta||!meta.ok){ document.getElementById('main').innerHTML='<div class="error-box">このURLは無効です。担当者にお問い合わせください。</div>'; return; }
    if(meta.has_pin){
      _passMode='enter';
      document.getElementById('passTitle').textContent='パスワード（4桁）を入力してください';
      document.getElementById('passBtn').textContent='ログイン';
      document.getElementById('passInput2').classList.add('hide');
    } else {
      _passMode='setup';
      document.getElementById('passTitle').textContent='パスワードを設定してください';
      document.getElementById('passOrgName').textContent='初回のみ：4桁の数字を決めてください';
      document.getElementById('passBtn').textContent='設定する';
      document.getElementById('passInput2').classList.remove('hide');
    }
    document.getElementById('passScreen').classList.remove('hide');
    setTimeout(function(){document.getElementById('passInput').focus();},100);
  }catch(e){ document.getElementById('main').innerHTML='<div class="error-box">読み込みエラー: '+esc(e.message)+'</div>'; }
}

async function loadData(pass){
  try{
    var res=await callRpc('applicant_view_get',{p_token:currentToken,p_pass:pass||''});
    if(!res||!res.ok){
      if(res&&res.error==='pass'){ return {passErr:true}; }
      document.getElementById('main').innerHTML='<div class="error-box">対象の申請が見つかりません。</div>'; return {ok:false};
    }
    theCase=res.case||{};
    thePerson=res.person||{};
    pdfCert=''; pdfCustody=''; pdfReceipt=res.pdf_receipt||''; pdfShinsa=res.pdf_shinsa||'';
    var _ac=thePerson.application_cert_pdf_urls; if(Array.isArray(_ac)&&_ac.length){ var _l1=_ac[_ac.length-1]; if(_l1&&_l1.url) pdfCert=_l1.url; }
    var _cu=thePerson.custody_receipt_pdf_urls; if(Array.isArray(_cu)&&_cu.length){ var _l2=_cu[_cu.length-1]; if(_l2&&_l2.url) pdfCustody=_l2.url; }
    hasHearingForm=!!res.has_hearing_form;
    cacheDocs=Array.isArray(res.cache_docs)?res.cache_docs:[];
    doneSet={};
    (res.doc_check||[]).forEach(function(row){
      var idx=row.doc_key.indexOf('::'); if(idx<0) return;
      var prefix=row.doc_key.substring(0,idx); var name=row.doc_key.substring(idx+2);
      var v=row.value; var truthy=(v!=null&&v!==''&&v!=='false');
      if((prefix==='staff'||prefix==='skip')&&truthy) doneSet[name]=true;
    });
    computeMissing();
    var nm=theCase.applicant||theCase.name||'';
    document.getElementById('headerName').textContent=nm+' 様';
    document.title=nm+' 様 | 提出書類・進捗確認';
    document.getElementById('tabs').style.display='flex';
    render();
    return {ok:true};
  }catch(e){ document.getElementById('main').innerHTML='<div class="error-box">読み込みエラー: '+esc(e.message)+'</div>'; return {ok:false}; }
}

function docDisplayList(){ return cacheDocs.filter(function(d){ return d && d.l && d.l!=='その他'; }); }
function isDocDone(d){ return !!doneSet[d.l] || !!d.done; }
function computeMissing(){
  missingDocCount=0;
  docDisplayList().forEach(function(d){ if(!isDocDone(d)) missingDocCount++; });
  var b=document.getElementById('tabDocBadge');
  if(missingDocCount>0){ b.textContent=missingDocCount; b.classList.remove('hide'); } else { b.classList.add('hide'); }
}

function switchTab(t){ currentTab=t; document.querySelectorAll('.tab').forEach(function(el){el.classList.toggle('active',el.dataset.tab===t);}); render(); }

function render(){
  var m=document.getElementById('main');
  if(currentTab==='status') m.innerHTML=renderStatus();
  else if(currentTab==='docs') m.innerHTML=renderDocs();
  else if(currentTab==='pdf') m.innerHTML=renderPdf();
  else if(currentTab==='info') m.innerHTML=renderInfo();
  else if(currentTab==='office') m.innerHTML=renderOffice();
  else if(currentTab==='flow') m.innerHTML=renderFlow();
}

function renderTodo(){

 '在留カード（表）':'zairyu_front','在留カード（裏）':'zairyu_back','在留カード':'zairyu_front',

};
function getDocHelp(name){
  if(!name) return null;
  var k=DOC_NAME2KEY[name];
  if(!k){ var base=String(name).replace(/[（(].*$/,'').trim(); k=DOC_NAME2KEY[base]; }
  return (k&&DOC_SAMPLES[k])?DOC_SAMPLES[k]:null;
}
function openDocHelp(name){
  var d=getDocHelp(name); if(!d) return;
  document.getElementById('dhTitle').textContent='❓ '+name;
  var img=d.image?(d.image.indexOf('http')===0?d.image:'https://ofusa2026.github.io/upload/'+d.image):'';
  var txt=(d.where&&(d.where.ja||d.where.en))||(d.help&&(d.help.ja||d.help.en))||'';
  var b='';
  if(img) b+='<div style="background:#f8fafc;border-radius:10px;padding:8px;margin-bottom:12px;text-align:center;"><img src="'+esc(img)+'" alt="sample" style="max-width:100%;max-height:46vh;border-radius:6px;" onerror="this.style.display=\'none\';this.parentElement.innerHTML=\'<div style=&quot;padding:30px;color:#94a3b8;font-size:13px;&quot;>📷 サンプル画像準備中</div>\';"></div>';
  if(txt) b+='<div class="dh-row"><div class="dh-l">取得方法・説明</div><div class="dh-v" style="white-space:pre-line;">'+esc(txt)+'</div></div>';
  document.getElementById('dhBody').innerHTML=b;
  document.getElementById('docHelpModal').classList.remove('hide');
}
function closeDocHelp(){ document.getElementById('docHelpModal').classList.add('hide'); }

function renderDocs(){
  var h='<div class="section-title">📄 あなたの提出書類</div>';
  h+='<div class="note">大房行政書士法人でチェックが入った書類は「提出済（または不要）」になります。「未提出」の書類はご提出をお願いいたします。ご不明点は担当者までご連絡ください。</div>';
  var upUrl=buildUploadUrl();
  if(upUrl){ h+='<div><a class="upload-btn" href="'+esc(upUrl)+'" target="_blank" rel="noopener">📤 書類をアップロード</a></div>'; }
  var list=docDisplayList();
  if(!list.length){ h+='<div class="empty">提出書類リストはまだ準備中です。担当者にお問い合わせください。</div>'; return h; }
  list=list.slice().sort(function(a,b){ var da=isDocDone(a)?1:0, db=isDocDone(b)?1:0; if(da!==db)return da-db; return String(a.l).localeCompare(String(b.l),'ja'); });
  h+='<div class="doc-co">';
  list.forEach(function(d){
    var done=isDocDone(d);
    var ico=done?'✅':'⬜';
    var stTxt=done?'提出済（または不要）':'未提出';
    var stCls=done?'s-done':'s-todo';
    var reqMark=(!done && d.r)?' <span style="color:#dc2626;font-size:10px;font-weight:800;">必須</span>':'';
    var helpBtn=getDocHelp(d.l)?' <button class="help-q" data-n="'+esc(d.l)+'" onclick="openDocHelp(this.dataset.n)">？</button>':'';
    h+='<div class="doc-row"><span class="doc-ico">'+ico+'</span><div class="doc-name">'+esc(d.l)+reqMark+helpBtn+'</div><span class="doc-state '+stCls+'">'+stTxt+'</span></div>';
  });
  h+='</div>';
  return h;
}

function _pdfBtn(label,url,color,icon){
  if(url) return '<a class="pdf-btn" style="background:'+color+';" href="'+esc(url)+'" target="_blank" rel="noopener">'+icon+' '+label+'</a>';
  return '<span class="pdf-btn pdf-none">'+icon+' '+label+'（未発行）</span>';
}

}

function renderInfo(){
  var c=theCase, p=thePerson;
  function row(l,v){ return '<div class="dt-row"><span class="dt-l">'+l+'</span><span class="dt-v">'+v+'</span></div>'; }
  var addr=[p.jp_postal_code?('〒'+p.jp_postal_code):'',p.jp_address||'',p.jp_detail_address||''].filter(Boolean).join(' ');
  var tel=p.phone||p.cel_phone||p.tel_num||'';
  var h='<div class="section-title">🪪 本人情報</div>';
  h+='<div class="info-card">';
  h+='<div class="dt-sec">基本情報</div>';
  h+=row('氏名',_dv(c.applicant||c.name));
  h+=row('生年月日',_dv(p.birthdate));
  h+=row('性別',_dv(p.gender));
  h+=row('国籍',_dv(p.nationality||c.nationality));
  h+='<div class="dt-sec">証明書番号</div>';
  h+=row('在留カード番号',_dv(p.residence_card));
  h+=row('パスポート番号',_dv(p.passport));
  h+=row('パスポート有効期限',_dv(p.passport_expiry));
  h+='<div class="dt-sec">連絡先</div>';
  h+=row('住所',_dv(addr));
  h+=row('母国住所',_dv(p.home_country_address));
  h+=row('電話',_dv(tel));
  h+=row('メール',_dv(p.email));
  h+='</div>';
  h+='<div class="note">内容に誤りがある場合は、担当者までご連絡ください。</div>';
  return h;
}
